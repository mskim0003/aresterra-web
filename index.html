<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ares Terra ($REDM) - Fullscreen 3D Mars</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #020307;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #f3f4f6;
        }

        #webglContainer {
            position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 1; cursor: grab;
        }
        #webglContainer:active { cursor: grabbing; }

        .lens-vignette {
            position: fixed; inset: 0; pointer-events: none; z-index: 2;
            background: radial-gradient(circle at center, transparent 60%, rgba(0, 5, 15, 0.85) 100%);
            box-shadow: inset 0 0 80px rgba(0, 229, 255, 0.12);
        }

        .hud-top {
            position: fixed; top: 0; left: 0; right: 0; z-index: 10;
            padding: 15px 28px; display: flex; justify-content: space-between; align-items: center;
            background: linear-gradient(180deg, rgba(4, 8, 20, 0.85) 0%, transparent 100%);
            pointer-events: none;
        }
        .hud-top > * { pointer-events: auto; }
        .brand-box { display: flex; align-items: center; gap: 12px; }
        .brand-title {
            font-size: 1.35rem; font-weight: 800; color: #ff5722;
            letter-spacing: 2px; text-shadow: 0 0 15px rgba(255, 87, 34, 0.6);
        }
        .altitude-badge {
            font-family: monospace; background: rgba(0, 229, 255, 0.12);
            border: 1px solid rgba(0, 229, 255, 0.4); color: #00e5ff;
            padding: 4px 10px; border-radius: 6px; font-size: 0.85rem;
        }
        .stats-hud {
            display: flex; gap: 20px; background: rgba(10, 16, 32, 0.78);
            border: 1px solid rgba(255, 255, 255, 0.15); padding: 8px 18px;
            border-radius: 30px; backdrop-filter: blur(8px); font-size: 0.9rem;
        }
        .stats-hud b { color: #00e5ff; }

        .bora-hud {
            position: fixed; bottom: 24px; left: 24px; z-index: 10;
            width: 420px; max-width: calc(100vw - 48px);
            background: rgba(10, 16, 34, 0.86); border: 1px solid rgba(0, 229, 255, 0.5);
            border-radius: 16px; padding: 16px 20px; backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), 0 0 20px rgba(0, 229, 255, 0.15);
            display: flex; gap: 15px; align-items: flex-start;
        }
        .bora-holo-avatar {
            width: 54px; height: 54px; border-radius: 50%;
            background: radial-gradient(circle at 50% 30%, #ff80ab, #651fff);
            border: 2px solid #00e5ff; display: flex; justify-content: center; align-items: center;
            font-size: 1.7rem; flex-shrink: 0; box-shadow: 0 0 15px #00e5ff;
        }
        .bora-content h4 {
            margin: 0 0 5px 0; color: #00e5ff; font-size: 0.9rem;
            display: flex; justify-content: space-between;
        }
        .bora-content p { margin: 0; font-size: 0.88rem; line-height: 1.5; color: #e2e8f0; }

        .control-hud {
            position: fixed; bottom: 24px; right: 24px; z-index: 10;
            width: 440px; max-width: calc(100vw - 48px);
            background: rgba(12, 18, 36, 0.88); border: 1px solid rgba(255, 87, 34, 0.5);
            border-radius: 16px; padding: 18px 22px; backdrop-filter: blur(12px);
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.8);
        }
        .panel-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px;
        }
        .panel-title { font-weight: bold; color: #ffab91; font-size: 1rem; }
        .btn-zoom-out {
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.25);
            color: #fff; padding: 5px 12px; border-radius: 6px; font-size: 0.8rem;
            cursor: pointer; display: none;
        }
        .btn-zoom-out:hover { background: #ff5722; border-color: #ff5722; }

        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .holo-btn {
            background: rgba(20, 30, 55, 0.9); border: 1px solid #00e5ff; color: #fff;
            padding: 10px 12px; border-radius: 10px; cursor: pointer; text-align: left;
            transition: 0.2s; font-size: 0.85rem;
        }
        .holo-btn:hover {
            background: rgba(0, 229, 255, 0.2); transform: translateY(-2px);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
        }
        .holo-btn.free-tag { border-color: #10b981; }
        .holo-btn.city-tag { border-color: #f59e0b; }
        .holo-btn small { display: block; font-size: 0.72rem; color: #94a3b8; margin-top: 3px; }

        #markersLayer { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
        .spatial-marker {
            position: absolute; transform: translate(-50%, -50%);
            pointer-events: auto; cursor: pointer; transition: transform 0.2s, opacity 0.3s;
        }
        .spatial-marker:hover { transform: translate(-50%, -50%) scale(1.15); z-index: 20; }
        .region-pin {
            background: rgba(5, 10, 24, 0.88); border: 2px solid #00e5ff; color: #fff;
            padding: 6px 14px; border-radius: 20px; font-size: 0.82rem; font-weight: bold;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.6); white-space: nowrap;
        }
        .region-pin.free { border-color: #10b981; box-shadow: 0 0 20px rgba(16, 185, 129, 0.6); }
        .region-pin.city { border-color: #f59e0b; box-shadow: 0 0 20px rgba(245, 158, 11, 0.6); }

        .plot-grid-box {
            width: 115px; height: 78px; background: rgba(16, 185, 129, 0.28);
            border: 2px solid #10b981; border-radius: 8px; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
            backdrop-filter: blur(2px); box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
        }
        .plot-grid-box.city-plot {
            width: 92px; height: 64px; background: rgba(245, 158, 11, 0.28);
            border-color: #f59e0b; box-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
        }
        .plot-grid-box.owned {
            background: rgba(255, 87, 34, 0.45); border-color: #fff; box-shadow: 0 0 25px #ff5722;
        }
        .plot-grid-box b { font-size: 0.78rem; color: #fff; text-shadow: 0 1px 3px #000; }
        .plot-grid-box span {
            font-size: 0.65rem; color: #ecfdf5; background: rgba(0,0,0,0.65);
            padding: 1px 6px; border-radius: 4px; margin-top: 3px;
        }

        .action-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
        .btn-primary {
            flex: 1; background: #10b981; color: #022c22; border: none; padding: 11px;
            border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.85rem;
        }
        .btn-coin {
            flex: 1; background: #ff5722; color: #fff; border: none; padding: 11px;
            border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.85rem;
        }
        .timeline-row { display: flex; gap: 6px; margin-top: 10px; }
        .time-btn {
            flex: 1; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2);
            color: #cbd5e1; padding: 7px; border-radius: 6px; font-size: 0.75rem; cursor: pointer;
        }
        .time-btn.active { background: #00e5ff; color: #000; font-weight: bold; border-color: #00e5ff; }
    </style>
</head>
<body>

        <div class="bora-content">

            <p id="boraSpeech">“사장님! 이제 기지 건물이 땅에 파묻히거나 삐딱하게 눕지 않고, <b>지표면 위에 반듯하게 서서 기지 전체 전경이 한눈에</b> 들어오도록 드론 카메라 각도를 완벽하게 교정했어요!”</p>

    <script>
        let myBalance = 10000;
        let burnedCoin = 0;
        let hasUsedFreeLease = false;

        let currentZoomStage = 1;
        let activeRegion = null;
        let activePlot = null;
        let currentTimelineMode = 'current';

        const marsRegions = [
            {
                id: 'riverside',

                sub: '넓은 땅 · 30일 무상임대',

                lat: 12, lon: -25,

                plots: [

                    { id: 'RV-02', name: '강변 녹지 A-02호(대형)', dLat: 5, dLon: 6, price: 1300, canFree: true, owner: null, status: 'none', desc: '강물 취수가 가장 유리한 특급 명당' },
                    { id: 'RV-03', name: '강변 숲 구역 A-03호(대형)', dLat: -5, dLon: -5, price: 1100, canFree: true, owner: null, status: 'none', desc: '대규모 산소 돔 및 생태 농장 부지' },
                    { id: 'RV-04', name: '강변 삼각주 A-04호(대형)', dLat: -4, dLon: 7, price: 1500, canFree: true, owner: null, status: 'none', desc: '두 강줄기가 합류하는 비옥한 삼각주' }
                ]
            },
            {
                id: 'greenvalley',
                name: '🌲 그린밸리 대평원',
                sub: '넓은 땅 · 30일 무상임대',
                type: 'free',
                lat: -18, lon: 35,
                boraMsg: '“그린밸리 대평원 상공입니다, 사장님! 넓고 평탄한 녹지 구획들이라 거대한 기지를 세우기 딱 좋아요. 눈으로 보고 마음에 드는 구획을 골라보세요!”',
                plots: [
                    { id: 'GV-01', name: '그린밸리 B-01호(대형)', dLat: 4, dLon: -5, price: 1000, canFree: true, owner: null, status: 'none', desc: '태양광 발전 및 대평원 복합 단지' },
                    { id: 'GV-02', name: '오아시스 B-02호(대형)', dLat: 3, dLon: 6, price: 1400, canFree: true, owner: null, status: 'none', desc: '천연 지하수 호수를 품은 핵심 녹지' },
                    { id: 'GV-03', name: '그린밸리 남단 B-03호(대형)', dLat: -5, dLon: 0, price: 1100, canFree: true, owner: null, status: 'none', desc: '테라포밍 산림 공원 예정 구역' }
                ]
            },
            {
                id: 'coastal',
                name: '🌊 코스탈 베이 해안도시',
                sub: '소형 알짜 · $REDM 코인 전용',
                type: 'city',
                lat: 22, lon: 40,
                boraMsg: '“푸른 바다가 출렁이는 코스탈 베이 해안도시 상공이에요! 여긴 중요 도시 구역이라 무상임대 없이 <b>$REDM 코인 정식 분양</b>으로만 선점하실 수 있어요!”',
                plots: [
                    { id: 'CB-01', name: '오션뷰 하버 C-01호(소형)', dLat: 3, dLon: -4, price: 2500, canFree: false, owner: null, status: 'none', desc: '바다 조망권 1열 최고급 해안 상업지' },
                    { id: 'CB-02', name: '마리나 부두 C-02호(소형)', dLat: 4, dLon: 5, price: 2800, canFree: false, owner: null, status: 'none', desc: '해상 교역선 중심 항만 노른자위 땅' },
                    { id: 'CB-03', name: '선셋 비치 C-03호(소형)', dLat: -4, dLon: 1, price: 2400, canFree: false, owner: null, status: 'none', desc: '해안 휴양 돔 복합 개발 지구' }
                ]
            },
            {
                id: 'olympus',
                name: '🏙️ 올림푸스 센트럴 시티',
                sub: '초밀집 도심 · $REDM 코인 전용',
                type: 'city',
                lat: -12, lon: -38,
                boraMsg: '“화성의 수도 올림푸스 센트럴 시티 상공입니다! 반짝이는 미래 도시 도로망 위에 자리 잡은 핵심지라 오직 <b>$REDM 코인</b>으로만 영구 분양이 가능합니다!”',
                plots: [
                    { id: 'OL-01', name: '센트럴 광장 D-01호(소형)', dLat: 3, dLon: -4, price: 3200, canFree: false, owner: null, status: 'none', desc: '중앙 광장 바로 앞 초특급 랜드마크 부지' },
                    { id: 'OL-02', name: '테크 타워 D-02호(소형)', dLat: 3, dLon: 5, price: 3000, canFree: false, owner: null, status: 'none', desc: '우주 엘리베이터 및 통신 본부 인접지' },
                    { id: 'OL-03', name: '메트로 역세권 D-03호(소형)', dLat: -4, dLon: 0, price: 2700, canFree: false, owner: null, status: 'none', desc: '자기부상열차 중앙역 환승 특구' }
                ]
            }
        ];

        let scene, camera, renderer, planetGroup, marsMesh, base3DGroup, radarDish, roverMesh;
        const PLANET_RADIUS = 10;

        let camDist = 28, targetCamDist = 28;
        let camHeightOffset = 0, targetCamHeightOffset = 0;
        let lookAtYOffset = 0, targetLookAtYOffset = 0;
        let currentRotX = 0.15, currentRotY = 0;
        let targetRotX = 0.15, targetRotY = 0;
        let autoRotate = true;
        let roverAngle = 0;

        function latLonToVector3(lat, lon, radius) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lon + 90) * (Math.PI / 180);
            const x = -radius * Math.sin(phi) * Math.cos(theta);
            const z = radius * Math.sin(phi) * Math.sin(theta);
            const y = radius * Math.cos(phi);
            return new THREE.Vector3(x, y, z);
        }

        function generateSmoothMarsTexture(mode = 'current') {
            const canvas = document.createElement('canvas');
            canvas.width = 2048;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            const bgGrad = ctx.createLinearGradient(0, 0, 0, 1024);
            if (mode === 'lastMonth') {
                bgGrad.addColorStop(0, '#3b1109');
                bgGrad.addColorStop(0.5, '#7c2412');
                bgGrad.addColorStop(1, '#260904');
            } else {
                bgGrad.addColorStop(0, '#4a150b');
                bgGrad.addColorStop(0.5, '#a8381b');
                bgGrad.addColorStop(1, '#330d06');
            }
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, 2048, 1024);

            for (let i = 0; i < 180; i++) {
                const x = Math.random() * 2048;
                const y = Math.random() * 1024;
                const r = Math.random() * 65 + 15;
                const g = ctx.createRadialGradient(x, y, r * 0.1, x, y, r);
                if (i % 2 === 0) {
                    g.addColorStop(0, 'rgba(35, 9, 4, 0.35)');
                    g.addColorStop(1, 'transparent');
                } else {
                    g.addColorStop(0, 'rgba(249, 115, 22, 0.2)');
                    g.addColorStop(1, 'transparent');
                }
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 1;
            for (let x = 0; x < 2048; x += 32) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 1024); ctx.stroke(); }
            for (let y = 0; y < 1024; y += 32) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(2048, y); ctx.stroke(); }

            if (mode === 'lastMonth') return new THREE.CanvasTexture(canvas);

            const alpha = mode === 'lastWeek' ? 0.45 : 0.95;

            marsRegions.forEach(reg => {
                const u = ((reg.lon + 180) / 360) * 2048;
                const v = ((90 - reg.lat) / 180) * 1024;

                const greenGrad = ctx.createRadialGradient(u, v, 5, u, v, 210);
                greenGrad.addColorStop(0, `rgba(16, 185, 129, ${0.82 * alpha})`);
                greenGrad.addColorStop(0.55, `rgba(5, 150, 105, ${0.5 * alpha})`);
                greenGrad.addColorStop(1, 'transparent');
                ctx.fillStyle = greenGrad;
                ctx.beginPath();
                ctx.arc(u, v, 210, 0, Math.PI * 2);
                ctx.fill();

                ctx.save();
                ctx.strokeStyle = `rgba(56, 189, 248, ${alpha})`;
                ctx.lineWidth = 14;
                ctx.shadowColor = '#00e5ff';
                ctx.shadowBlur = 15;
                ctx.beginPath();
                ctx.moveTo(u - 170, v - 80);
                ctx.bezierCurveTo(u - 50, v + 40, u + 40, v - 50, u + 180, v + 70);
                ctx.stroke();

                if (reg.type === 'city') {
                    ctx.strokeStyle = `rgba(251, 191, 36, ${0.55 * alpha})`;
                    ctx.lineWidth = 2;
                    for (let dx = -90; dx <= 90; dx += 18) {
                        ctx.beginPath(); ctx.moveTo(u + dx, v - 90); ctx.lineTo(u + dx, v + 90); ctx.stroke();
                        ctx.beginPath(); ctx.moveTo(u - 90, v + dx); ctx.lineTo(u + 90, v + dx); ctx.stroke();
                    }
                }

                if (reg.id === 'coastal') {
                    const seaGrad = ctx.createRadialGradient(u + 45, v - 25, 10, u + 45, v - 25, 140);
                    seaGrad.addColorStop(0, `rgba(2, 132, 199, ${alpha})`);
                    seaGrad.addColorStop(0.8, `rgba(14, 165, 233, ${0.7 * alpha})`);
                    seaGrad.addColorStop(1, 'transparent');
                    ctx.fillStyle = seaGrad;
                    ctx.beginPath();
                    ctx.arc(u + 45, v - 25, 140, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            });

            return new THREE.CanvasTexture(canvas);
        }

        // ★ 핵심 교정: Y축(위쪽)을 지표면 수직 기준으로 삼아 모든 건물이 땅 위에 반듯하게 서도록 설계!
        function createDetailedMarsBase() {
            const group = new THREE.Group();

            // 0) 초근접 시 흐릿한 배경을 가려주는 고해상도 테라포밍 육각 구획 바닥링
            const groundRingGeo = new THREE.RingGeometry(0.24, 0.55, 32);
            const groundRingMat = new THREE.MeshBasicMaterial({
                color: 0x00e5ff, wireframe: true, transparent: true, opacity: 0.28, side: THREE.DoubleSide
            });
            const groundRing = new THREE.Mesh(groundRingGeo, groundRingMat);
            groundRing.rotation.x = Math.PI / 2;
            groundRing.position.y = 0.005;
            group.add(groundRing);

            // 1) 기지 메인 착륙 플랫폼 (납작하고 넓게 땅에 밀착)
            const padGeo = new THREE.CylinderGeometry(0.24, 0.27, 0.018, 32);
            const padMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.6, roughness: 0.4 });
            const pad = new THREE.Mesh(padGeo, padMat);
            pad.position.y = 0.009;
            group.add(pad);

            // 플랫폼 위 푸른 바이오 생태 숲 바닥
            const parkGeo = new THREE.CylinderGeometry(0.16, 0.16, 0.022, 32);
            const parkMat = new THREE.MeshStandardMaterial({ color: 0x10b981, roughness: 0.7 });
            const park = new THREE.Mesh(parkGeo, parkMat);
            park.position.y = 0.012;
            group.add(park);

            // 2) 중앙 메인 지오데식 생태 돔 (Y축 위쪽으로 반듯하게 솟은 반구형 돔)
            const mainDomeGeo = new THREE.SphereGeometry(0.15, 24, 16, 0, Math.PI * 2, 0, Math.PI / 2);
            const mainDomeMat = new THREE.MeshStandardMaterial({
                color: 0x38bdf8, transparent: true, opacity: 0.42, roughness: 0.1, metalness: 0.3
            });
            const mainDome = new THREE.Mesh(mainDomeGeo, mainDomeMat);
            mainDome.position.y = 0.015;
            group.add(mainDome);

            const wireGeo = new THREE.SphereGeometry(0.152, 12, 8, 0, Math.PI * 2, 0, Math.PI / 2);
            const wireMat = new THREE.MeshBasicMaterial({ color: 0x00e5ff, wireframe: true, transparent: true, opacity: 0.75 });
            const wireDome = new THREE.Mesh(wireGeo, wireMat);
            wireDome.position.y = 0.015;
            group.add(wireDome);

            // 3) 돔 내부에 우뚝 솟은 미래형 마천루 빌딩 5개
            for (let i = 0; i < 5; i++) {
                const bH = 0.045 + (i % 3) * 0.025;
                const bGeo = new THREE.BoxGeometry(0.024, bH, 0.024);
                const bMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, emissive: 0x0284c7, emissiveIntensity: 0.5 });
                const bMesh = new THREE.Mesh(bGeo, bMat);
                const angle = (i / 5) * Math.PI * 2;
                const r = i === 0 ? 0 : 0.055;
                bMesh.position.set(Math.cos(angle) * r, 0.015 + bH / 2, Math.sin(angle) * r);
                group.add(bMesh);
            }

            // 4) 주변 3개의 보조 거주 바이오 돔 + 메인 돔과 이어지는 연결 터널
            const subAngles = [0.4, 2.5, 4.6];
            subAngles.forEach(ang => {
                const dist = 0.21;
                const sx = Math.cos(ang) * dist;
                const sz = Math.sin(ang) * dist;

                const subDome = new THREE.Mesh(
                    new THREE.SphereGeometry(0.06, 16, 12, 0, Math.PI * 2, 0, Math.PI / 2),
                    mainDomeMat
                );
                subDome.position.set(sx, 0.012, sz);
                group.add(subDome);

                const subWire = new THREE.Mesh(
                    new THREE.SphereGeometry(0.062, 8, 6, 0, Math.PI * 2, 0, Math.PI / 2),
                    wireMat
                );
                subWire.position.set(sx, 0.012, sz);
                group.add(subWire);

                // 연결 통로 파이프
                const tunnelGeo = new THREE.BoxGeometry(0.08, 0.018, 0.022);
                const tunnelMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8 });
                const tunnel = new THREE.Mesh(tunnelGeo, tunnelMat);
                tunnel.position.set(sx * 0.65, 0.02, sz * 0.65);
                tunnel.rotation.y = -ang;
                group.add(tunnel);
            });

            // 5) 우측 레드엠($REDM) 채굴 타워 & 회전 레이더 안테나
            const towerGeo = new THREE.CylinderGeometry(0.01, 0.024, 0.19, 12);
            const towerMat = new THREE.MeshStandardMaterial({ color: 0xff5722, emissive: 0x9a3412, emissiveIntensity: 0.6 });
            const tower = new THREE.Mesh(towerGeo, towerMat);
            tower.position.set(0.16, 0.015 + 0.095, -0.12);
            group.add(tower);

            radarDish = new THREE.Mesh(
                new THREE.BoxGeometry(0.09, 0.012, 0.018),
                new THREE.MeshBasicMaterial({ color: 0x00e5ff })
            );
            radarDish.position.set(0.16, 0.215, -0.12);
            group.add(radarDish);

            // 6) 기지 둘레를 실시간으로 순찰하며 도는 화성 탐사 로버
            roverMesh = new THREE.Mesh(
                new THREE.BoxGeometry(0.028, 0.016, 0.04),
                new THREE.MeshBasicMaterial({ color: 0xfacc15 })
            );
            roverMesh.position.set(0.32, 0.015, 0);
            group.add(roverMesh);

            return group;
        }

        function initWorld() {
            const container = document.getElementById('webglContainer');
            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, camDist);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xdbeafe, 0.7));
            const sun = new THREE.DirectionalLight(0xfff1e6, 1.35);
            sun.position.set(20, 22, 25);
            scene.add(sun);

            planetGroup = new THREE.Group();
            scene.add(planetGroup);

            const marsGeo = new THREE.SphereGeometry(PLANET_RADIUS, 128, 128);
            const tex = generateSmoothMarsTexture('current');
            const marsMat = new THREE.MeshStandardMaterial({
                map: tex, roughness: 0.78, metalness: 0.1
            });
            marsMesh = new THREE.Mesh(marsGeo, marsMat);
            planetGroup.add(marsMesh);

            const atmosGeo = new THREE.SphereGeometry(PLANET_RADIUS + 0.32, 64, 64);
            const atmosMat = new THREE.MeshBasicMaterial({
                color: 0x38bdf8, transparent: true, opacity: 0.14, side: THREE.BackSide
            });
            planetGroup.add(new THREE.Mesh(atmosGeo, atmosMat));

            base3DGroup = createDetailedMarsBase();
            base3DGroup.visible = false;
            planetGroup.add(base3DGroup);

            const starGeo = new THREE.BufferGeometry();
            const starPos = new Float32Array(2000 * 3);
            for (let i = 0; i < 2000 * 3; i++) starPos[i] = (Math.random() - 0.5) * 180;
            starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
            scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.12 })));

            let dragging = false;
            let prev = { x: 0, y: 0 };
            container.addEventListener('mousedown', e => {
                dragging = true; autoRotate = false; prev = { x: e.clientX, y: e.clientY };
            });
            window.addEventListener('mouseup', () => dragging = false);
            window.addEventListener('mousemove', e => {
                if (!dragging) return;
                const speed = currentZoomStage === 1 ? 0.005 : 0.0018;
                targetRotY += (e.clientX - prev.x) * speed;
                targetRotX = Math.max(-1.2, Math.min(1.2, targetRotX + (e.clientY - prev.y) * speed));
                prev = { x: e.clientX, y: e.clientY };
            });

            container.addEventListener('wheel', e => {
                targetCamDist = Math.max(10.85, Math.min(34, targetCamDist + e.deltaY * 0.01));
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            buildSpatialMarkers();
            renderControlPanel();
            animateLoop();
        }

        const domMarkers = [];

        function buildSpatialMarkers() {
            const layer = document.getElementById('markersLayer');
            layer.innerHTML = '';
            domMarkers.length = 0;

            marsRegions.forEach(reg => {
                const pinEl = document.createElement('div');
                pinEl.className = `spatial-marker region-pin ${reg.type}`;
                pinEl.innerHTML = `${reg.name} <div style="font-size:0.68rem; font-weight:normal; opacity:0.85;">${reg.sub}</div>`;
                pinEl.onclick = () => zoomToStage2(reg);
                layer.appendChild(pinEl);

                domMarkers.push({
                    stage: 1, regionId: reg.id, el: pinEl,
                    localPos: latLonToVector3(reg.lat, reg.lon, PLANET_RADIUS + 0.15)
                });

                reg.plots.forEach(plot => {
                    const boxEl = document.createElement('div');
                    boxEl.id = `marker-${plot.id}`;
                    boxEl.className = `spatial-marker plot-grid-box ${reg.type === 'city' ? 'city-plot' : ''} ${plot.owner ? 'owned' : ''}`;
                    updatePlotMarkerText(boxEl, plot);
                    boxEl.onclick = () => selectPlotIn3D(reg, plot);
                    layer.appendChild(boxEl);

                    domMarkers.push({
                        stage: 2, regionId: reg.id, plotId: plot.id, el: boxEl,
                        localPos: latLonToVector3(reg.lat + plot.dLat, reg.lon + plot.dLon, PLANET_RADIUS + 0.05)
                    });
                });
            });
        }

        function updatePlotMarkerText(el, plot) {
            let tag = plot.canFree ? (hasUsedFreeLease ? `${plot.price} REDM` : `🎁 30일 무상임대`) : `💎 ${plot.price} REDM`;
            if (plot.status === 'leased') tag = `🕒 사장님 임대중(D-30)`;
            if (plot.status === 'owned') tag = `👑 사장님 영구소유`;
            el.className = `spatial-marker plot-grid-box ${!plot.canFree ? 'city-plot' : ''} ${plot.owner ? 'owned' : ''}`;
            el.innerHTML = `<b>${plot.name}</b><span>${tag}</span>`;
        }

        function syncMarkersWith3DGlobe() {
            domMarkers.forEach(m => {
                if (currentZoomStage === 1 && m.stage !== 1) { m.el.style.display = 'none'; return; }
                if (currentZoomStage === 2 && (m.stage !== 2 || m.regionId !== activeRegion.id)) { m.el.style.display = 'none'; return; }
                if (currentZoomStage === 3) { m.el.style.display = 'none'; return; }

                const worldPos = m.localPos.clone().applyEuler(planetGroup.rotation);
                if (worldPos.z < 2.5) { m.el.style.display = 'none'; return; }

                const projected = worldPos.clone().project(camera);
                const x = (projected.x * 0.5 + 0.5) * window.innerWidth;
                const y = (-(projected.y * 0.5) + 0.5) * window.innerHeight;

                m.el.style.display = 'flex';
                m.el.style.left = `${x}px`;
                m.el.style.top = `${y}px`;
            });
        }

        function aimGlobeAt(lat, lon) {
            autoRotate = false;
            targetRotX = lat * (Math.PI / 180);
            targetRotY = -lon * (Math.PI / 180);
        }

        function zoomToStage2(region) {
            currentZoomStage = 2;
            activeRegion = region;
            activePlot = null;
            base3DGroup.visible = false;

            aimGlobeAt(region.lat, region.lon);
            targetCamDist = 13.4;
            targetCamHeightOffset = 0;
            targetLookAtYOffset = 0;

            document.getElementById('boraSpeech').innerHTML = region.boraMsg;
            document.getElementById('btnZoomOut').style.display = 'block';
            renderControlPanel();
        }

        function selectPlotIn3D(region, plot) {
            activePlot = plot;
            aimGlobeAt(region.lat + plot.dLat, region.lon + plot.dLon);
            targetCamDist = 12.2;
            targetCamHeightOffset = 0;
            targetLookAtYOffset = 0;

            if (plot.owner) {
                document.getElementById('boraSpeech').innerHTML = `“사장님의 영토인 <b>[${plot.name}]</b>입니다! 오른쪽 아래의 <b>[🚀 지표면 기지로 착륙하기]</b>를 누르면 반듯하게 지어진 3D 기지 전체 전경이 펼쳐져요!”`;
            } else if (plot.canFree) {
                if (!hasUsedFreeLease) {
                    document.getElementById('boraSpeech').innerHTML = `“사장님, <b>[${plot.name}]</b> 위치가 정말 끝내줘요! 첫 녹지 혜택으로 <b>30일간 비용 없이 무상임대</b>를 받아 바로 개척해 보시겠어요?”`;
                } else {
                    document.getElementById('boraSpeech').innerHTML = `“사장님, 1인당 1회 무상임대 혜택은 이미 사용하셔서, 이 땅을 추가로 확보하시려면 <b>${plot.price.toLocaleString()} REDM 코인</b>으로 정식 분양을 받으셔야 해요!”`;
                }
            } else {
                document.getElementById('boraSpeech').innerHTML = `“핵심 도시 구역인 <b>[${plot.name}]</b>을 고르셨네요! 여긴 중요 지역이라 무상임대 없이 <b>${plot.price.toLocaleString()} REDM 코인</b>으로만 영구 분양받으실 수 있어요!”`;
            }
            renderControlPanel();
        }

        // ★ [3단계 착륙 교정] 기지를 구면 법선(Surface Normal)에 맞춰 100% 수직으로 세우고, 드론 조망 앵글로 비스듬히 내려다봄!
        function zoomToStage3Base(plot) {
            currentZoomStage = 3;
            const lat = activeRegion.lat + plot.dLat;
            const lon = activeRegion.lon + plot.dLon;

            const surfacePos = latLonToVector3(lat, lon, PLANET_RADIUS);
            base3DGroup.position.copy(surfacePos);

            // 화성 중심에서 바깥쪽을 향하는 수직 벡터(Normal)에 기지의 위쪽(Y축)을 정확히 일치시킴!
            const normal = surfacePos.clone().normalize();
            base3DGroup.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), normal);
            base3DGroup.visible = true;

            if (currentTimelineMode !== 'current') {
                currentTimelineMode = 'current';
                marsMesh.material.map = generateSmoothMarsTexture('current');
                marsMesh.material.needsUpdate = true;
            }

            // 기지가 정면 살짝 아래쪽에 놓이도록 회전하고, 드론이 상공에서 비스듬히 기지 전체를 내려다보는 구도 설정
            aimGlobeAt(lat - 2.2, lon);
            targetCamDist = 11.25;         // 너무 코앞에 붙지 않고 기지 단지 전체가 한눈에 들어오는 황금 거리!
            targetCamHeightOffset = -0.55; // 카메라 위치와 시선을 조절해 입체적인 드론 조망 각도 완성
            targetLookAtYOffset = 0.35;

            document.getElementById('boraSpeech').innerHTML = `“와아! <b>[${plot.name}]</b> 상공 드론 뷰로 착륙했어요! 이제 기지가 삐딱하게 눕지 않고 지표면 위에 반듯하게 서서 <b>중앙 생태 돔, 보조 기지, 채굴 타워, 순찰 로버</b>까지 한눈에 다 들어오죠?”`;
            renderControlPanel();
        }

        function stepZoomOut() {
            if (currentZoomStage === 3) {
                zoomToStage2(activeRegion);
            } else {
                currentZoomStage = 1;
                activeRegion = null;
                activePlot = null;
                base3DGroup.visible = false;
                targetCamDist = 28;
                targetCamHeightOffset = 0;
                targetLookAtYOffset = 0;
                autoRotate = true;
                document.getElementById('btnZoomOut').style.display = 'none';
                document.getElementById('boraSpeech').innerHTML = `“다시 우주 궤도로 줌아웃했습니다, 사장님! 둥근 화성을 돌려보며 다른 대륙이나 해안 도시도 클릭해 보세요.”`;
                renderControlPanel();
            }
        }

        function claimFreeLease() {
            if (!activePlot) return;
            if (hasUsedFreeLease) {
                alert(`❗ [무상임대 거절 안내]\n\n보라: "사장님! 30일 무상임대 혜택은 한 아이디당 1곳만 제공됩니다.\n이 토지를 원하시면 $REDM 코인을 지불해 정식 분양을 받아주세요!"`);
                return;
            }
            hasUsedFreeLease = true;
            activePlot.owner = "사장님";
            activePlot.status = "leased";
            updatePlotMarkerText(document.getElementById(`marker-${activePlot.id}`), activePlot);
            updateTopHUD();
            alert(`🎉 [${activePlot.name}] 30일 무상임대 완료!\n이제 지표면 기지로 착륙해 전경을 감상해 보세요!`);
            zoomToStage3Base(activePlot);
        }

        function buyPlotWithCoin() {
            if (!activePlot) return;
            if (myBalance < activePlot.price) {
                alert("❌ 보유하신 $REDM 코인이 부족합니다!");
                return;
            }
            myBalance -= activePlot.price;
            burnedCoin += Math.floor(activePlot.price * 0.1);
            activePlot.owner = "사장님";
            activePlot.status = "owned";
            updatePlotMarkerText(document.getElementById(`marker-${activePlot.id}`), activePlot);
            updateTopHUD();
            alert(`👑 [${activePlot.name}] 영구 소유 등기 완료!`);
            zoomToStage3Base(activePlot);
        }

        function runBaseWork(workName, reward) {
            myBalance += reward;
            updateTopHUD();

            if (currentTimelineMode !== 'current') {
                const firstBtn = document.querySelector('.time-btn');
                if (firstBtn) change3DTimeline('current', firstBtn);
            }

            base3DGroup.scale.set(1.18, 1.18, 1.18);
            setTimeout(() => base3DGroup.scale.set(1, 1, 1), 350);

            document.getElementById('boraSpeech').innerHTML = `“멋져요 사장님! <b>[${workName}]</b> 작업으로 <b>+${reward} REDM</b> 코인을 획득하셨습니다! 기지 둘레를 도는 노란 탐사 로버와 채굴 타워가 힘차게 돌아가고 있어요!”`;
        }

        function change3DTimeline(mode, btn) {
            currentTimelineMode = mode;
            document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');

            const newTex = generateSmoothMarsTexture(mode);
            marsMesh.material.map = newTex;
            marsMesh.material.needsUpdate = true;

            if (mode === 'current') {
                base3DGroup.visible = true;
                base3DGroup.scale.set(1, 1, 1);
                document.getElementById('boraSpeech').innerHTML = `“<b>[현재 모습]</b> 푸른 강물이 흐르고 육각형 생태 돔 단지가 반듯하게 가동 중인 테라포밍 화성이에요!”`;
            } else if (mode === 'lastWeek') {
                base3DGroup.visible = true;
                base3DGroup.scale.set(0.55, 0.55, 0.55);
                document.getElementById('boraSpeech').innerHTML = `“<b>[지난주 기록]</b> 처음 운하 수로를 파서 물길을 끌어오고 기초 돔을 짓던 시절입니다.”`;
            } else {
                base3DGroup.visible = false;
                document.getElementById('boraSpeech').innerHTML = `“<b>[지난달 기록]</b> 사장님이 개척하시기 전, 건물도 물도 없이 붉은 모래만 가득하던 원시 화성입니다.”`;
            }
        }

        function updateTopHUD() {
            document.getElementById('balanceText').innerText = myBalance.toLocaleString();
            document.getElementById('burnText').innerText = burnedCoin.toLocaleString();
            const t = document.getElementById('leaseTicketText');
            if (hasUsedFreeLease) {
                t.innerText = "사용 완료 (추가 토지는 코인 결제)";
                t.style.color = "#f59e0b";
            }
        }

        function renderControlPanel() {
            const titleEl = document.getElementById('panelTitle');
            const bodyEl = document.getElementById('panelBody');

            if (currentZoomStage === 1) {
                titleEl.innerText = "🔭 1단계: 클로즈업할 화성 지역 선택";
                bodyEl.innerHTML = `
                    <div class="btn-grid">
                        ${marsRegions.map(r => `
                            <button class="holo-btn ${r.type === 'free' ? 'free-tag' : 'city-tag'}" onclick="zoomToStage2ById('${r.id}')">
                                <b>${r.name}</b>
                                <small>${r.sub}</small>
                            </button>
                        `).join('')}
                    </div>
                `;
            } else if (currentZoomStage === 2) {
                titleEl.innerText = `📍 2단계: ${activeRegion.name}`;
                if (!activePlot) {
                    bodyEl.innerHTML = `<p style="margin:0; font-size:0.88rem; color:#cbd5e1;">👆 눈앞의 3D 화성 표면 위에 펼쳐진 <b>네모 구획(필지)</b>을 직접 클릭해 원하는 땅을 골라보세요!</p>`;
                } else {
                    let buttonsHtml = '';
                    if (activePlot.owner) {
                        if (activePlot.status === 'leased') {
                            buttonsHtml += `<button class="btn-coin" onclick="buyPlotWithCoin()">👑 영구 소유 전환 (${activePlot.price} REDM)</button>`;
                        }
                        buttonsHtml += `<button class="btn-primary" onclick="zoomToStage3Base(activePlot)">🚀 지표면 기지로 착륙하기</button>`;
                    } else {
                        if (activePlot.canFree) {
                            buttonsHtml += `<button class="btn-primary" onclick="claimFreeLease()">🎁 30일 무상임대 (0 REDM)</button>`;
                        }
                        buttonsHtml += `<button class="btn-coin" onclick="buyPlotWithCoin()">💰 코인 영구 분양 (${activePlot.price} REDM)</button>`;
                    }

                    bodyEl.innerHTML = `
                        <div style="font-size:0.92rem; font-weight:bold; color:#00e5ff;">선택됨: ${activePlot.name}</div>
                        <div style="font-size:0.8rem; color:#94a3b8; margin-top:3px;">${activePlot.desc}</div>
                        <div class="action-row">${buttonsHtml}</div>
                    `;
                }
            } else if (currentZoomStage === 3) {
                titleEl.innerText = `🚀 3단계: ${activePlot.name} 지표면 기지`;
                bodyEl.innerHTML = `
                    <div class="timeline-row">
                        <button class="time-btn active" onclick="change3DTimeline('current', this)">🟢 현재 푸른 기지</button>
                        <button class="time-btn" onclick="change3DTimeline('lastWeek', this)">⏳ 지난주 수로공사</button>
                        <button class="time-btn" onclick="change3DTimeline('lastMonth', this)">📜 지난달 황무지</button>
                    </div>
                    <div class="action-row">
                        <button class="btn-primary" onclick="runBaseWork('지하 수맥 탐사', 50)">🛰️ 탐사 (+50)</button>
                        <button class="btn-coin" onclick="runBaseWork('레드엠 코어 채굴', 120)">⛏️ 채굴 (+120)</button>
                        <button class="btn-primary" style="background:#00e5ff;" onclick="runBaseWork('생태 산소돔 증축', 200)">🏗️ 증축 (+200)</button>
                    </div>
                `;
            }
        }

        function zoomToStage2ById(id) {
            const reg = marsRegions.find(r => r.id === id);
            if (reg) zoomToStage2(reg);
        }

        function animateLoop() {
            requestAnimationFrame(animateLoop);

            if (autoRotate && currentZoomStage === 1) {
                targetRotY += 0.0012;
            }

            if (base3DGroup && base3DGroup.visible) {
                if (radarDish) radarDish.rotation.y += 0.05;
                if (roverMesh) {
                    roverAngle += 0.015;
                    roverMesh.position.set(Math.cos(roverAngle) * 0.31, 0.015, Math.sin(roverAngle) * 0.31);
                    roverMesh.rotation.y = -roverAngle;
                }
            }

            currentRotX += (targetRotX - currentRotX) * 0.07;
            currentRotY += (targetRotY - currentRotY) * 0.07;
            planetGroup.rotation.x = currentRotX;
            planetGroup.rotation.y = currentRotY;

            camDist += (targetCamDist - camDist) * 0.07;
            camHeightOffset += (targetCamHeightOffset - camHeightOffset) * 0.07;
            lookAtYOffset += (targetLookAtYOffset - lookAtYOffset) * 0.07;

            camera.position.set(0, camHeightOffset, camDist);
            camera.lookAt(0, lookAtYOffset, 0);

            const km = Math.max(1, Math.floor((camDist - 11.2) * 850));
            document.getElementById('altitudeDisplay').innerText = `고도: ${km.toLocaleString()} KM (${currentZoomStage === 1 ? '우주 궤도' : currentZoomStage === 2 ? '지역 상공 구획 뷰' : '지표면 드론 조망 뷰'})`;

            syncMarkersWith3DGlobe();
            renderer.render(scene, camera);
        }

        window.onload = initWorld;
    </script>
</body>
</html>
