<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Ares Terra ($REDM) - Official Testnet Gateway</title>
    <style>
        body {
            background-color: #05070d;
            color: #f3f4f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* --- 1단계: 게이트웨이 (첫 화면) --- */
        #gatewayScreen {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: radial-gradient(circle at center, #1a0b12 0%, #05070d 70%);
            transition: opacity 0.8s ease-in-out;
            position: relative;
        }
        .portal-ring {
            width: 220px;
            height: 220px;
            border: 4px dashed #ff5722;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: spin 15s linear infinite;
            margin-bottom: 30px;
            box-shadow: 0 0 35px rgba(255, 87, 34, 0.5);
        }
        .portal-core {
            width: 180px;
            height: 180px;
            background: radial-gradient(circle, #ff5722 0%, #3d120a 80%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
            transition: transform 0.3s;
        }
        .portal-core:hover {
            transform: scale(1.08);
            box-shadow: 0 0 25px #ff5722;
        }
        .portal-core span {
            font-weight: bold;
            font-size: 1.1rem;
            color: #ffffff;
            letter-spacing: 1px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .gateway-title h1 {
            color: #ff5722;
            font-size: 2.8rem;
            margin-bottom: 10px;
            letter-spacing: 3px;
        }
        .gateway-title p {
            color: #9ca3af;
            font-size: 1.15rem;
            max-width: 550px;
            line-height: 1.6;
        }

        /* --- 2단계: 랜드 분양 & $REDM 시뮬레이터 화면 --- */
        #simulatorScreen {
            display: none;
            padding: 30px 20px;
            animation: fadeIn 0.8s ease-in-out;
            max-width: 900px;
            margin: 0 auto;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            color: #ff5722;
            margin-bottom: 5px;
        }
        .dashboard {
            display: flex;
            justify-content: space-around;
            background: #151b2b;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            border: 1px solid #2a344d;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .stat-box {
            text-align: center;
        }
        .stat-box p {
            margin: 0 0 5px 0;
            color: #9ca3af;
            font-size: 0.9rem;
        }
        .stat-box span {
            font-size: 1.3rem;
            font-weight: bold;
            color: #00bcd4;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }
        .land-card {
            background: #1a2238;
            border: 1px solid #2e3b5e;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            transition: 0.2s;
        }
        .land-card.owned {
            border-color: #ff5722;
            background: #221417;
        }
        .land-card h3 {
            margin-top: 0;
            color: #ffab91;
            font-size: 1.1rem;
        }
        .land-card p {
            font-size: 0.95rem;
            color: #d1d5db;
        }
        button.action-btn {
            background-color: #ff5722;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            width: 100%;
            transition: 0.2s;
        }
        button.action-btn:hover {
            background-color: #e64a19;
        }
        button.action-btn:disabled {
            background-color: #374151;
            color: #9ca3af;
            cursor: not-allowed;
        }
        .back-bar {
            margin-bottom: 20px;
            text-align: left;
        }
        .back-btn {
            background: transparent;
            border: 1px solid #4b5563;
            color: #9ca3af;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        .back-btn:hover {
            border-color: #ff5722;
            color: #ff5722;
        }
    </style>
</head>
<body>

    <!-- 1단계: 게이트웨이 대문 화면 -->
    <div id="gatewayScreen">
        <div class="gateway-title">
            <h1>ARES TERRA</h1>
            <p>환영한다, 개척자여.<br>강렬한 레드엠(<strong>$REDM</strong>) 토큰으로 화성의 위대한 영토를 선점하라.</p>
        </div>
        <div class="portal-ring">
            <div class="portal-core" onclick="enterGateway()">
                <span>ENTER GATE</span>
            </div>
        </div>
    </div>

    <!-- 2단계: 랜드 분양 & $REDM 시뮬레이터 화면 -->
    <div id="simulatorScreen">
        <div class="back-bar">
            <button class="back-btn" onclick="exitGateway()">← 화성 게이트로 돌아가기</button>
        </div>
        <div class="header">
            <h1>Ares Terra ($REDM) Testnet</h1>
            <p>화성 가상 영토 분양 및 실시간 토큰 흐름 시뮬레이터 (aresterra.io)</p>
        </div>

        <div class="dashboard">
            <div class="stat-box">
                <p>내 보유 잔고</p>
                <span id="balance">10,000</span> REDM
            </div>
            <div class="stat-box">
                <p>회사 초기 보유 물량</p>
                <span id="companyStock">1,000,000</span> REDM
            </div>
            <div class="stat-box">
                <p>총 소각된 토큰 (Burn)</p>
                <span id="burnedStock">0</span> REDM
            </div>
        </div>

        <div class="grid-container" id="landGrid">
            <!-- 동적 생성 -->
        </div>
    </div>

    <script>
        let myBalance = 10000;
        let companyStock = 1000000;
        let burnedStock = 0;

        const lands = [
            { id: 1, name: "Sector A-01 (Olympus Prime)", price: 1500, owner: null },
            { id: 2, name: "Sector A-02 (Valles Marineris)", price: 2000, owner: null },
            { id: 3, name: "Sector B-01 (Elysium Planitia)", price: 1200, owner: null },
            { id: 4, name: "Sector B-02 (Arcadia Planitia)", price: 1000, owner: null },
            { id: 5, name: "Sector C-01 (Hellas Basin)", price: 2500, owner: null },
            { id: 6, name: "Sector C-02 (Tharsis Dome)", price: 3000, owner: null }
        ];

        function enterGateway() {
            const gateway = document.getElementById('gatewayScreen');
            gateway.style.opacity = '0';
            setTimeout(() => {
                gateway.style.display = 'none';
                const sim = document.getElementById('simulatorScreen');
                sim.style.display = 'block';
                renderLands();
            }, 800);
        }

        function exitGateway() {
            const sim = document.getElementById('simulatorScreen');
            sim.style.display = 'none';
            const gateway = document.getElementById('gatewayScreen');
            gateway.style.display = 'flex';
            setTimeout(() => {
                gateway.style.opacity = '1';
            }, 50);
        }

        function renderLands() {
            const grid = document.getElementById('landGrid');
            grid.innerHTML = '';
            
            lands.forEach(land => {
                const card = document.createElement('div');
                card.className = `land-card ${land.owner ? 'owned' : ''}`;
                card.innerHTML = `
                    <h3>${land.name}</h3>
                    <p>분양가: <b>${land.price.toLocaleString()} REDM</b></p>
                    <p>상태: ${land.owner ? '🏠 소유주: ' + land.owner : '✨ 분양 대기중'}</p>
                    <button class="action-btn" ${land.owner ? 'disabled' : ''} onclick="buyLand(${land.id})">
                        ${land.owner ? '분양 완료' : '토지 청약하기'}
                    </button>
                `;
                grid.appendChild(card);
            });

            document.getElementById('balance').innerText = myBalance.toLocaleString();
            document.getElementById('companyStock').innerText = companyStock.toLocaleString();
            document.getElementById('burnedStock').innerText = burnedStock.toLocaleString();
        }

        function buyLand(id) {
            const land = lands.find(l => l.id === id);
            if (myBalance >= land.price) {
                myBalance -= land.price;
                companyStock += land.price; 
                
                // 분양 대금의 10% 소각(Burn) 메커니즘 적용
                const burnAmount = Math.floor(land.price * 0.1);
                companyStock -= burnAmount;
                burnedStock += burnAmount;

                land.owner = "오빠 (개척자)";
                alert(`🎉 [${land.name}] 분양 성공!\n\n- 지불 금액: ${land.price.toLocaleString()} REDM\n- 생태계 소각(Burn): ${burnAmount.toLocaleString()} REDM`);
                renderLands();
            } else {
                alert("❌ 잔고($REDM)가 부족합니다!");
            }
        }
    </script>

</body>
</html>
