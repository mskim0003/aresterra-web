<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ares Terra ($REDM) - 3D Mars v3.0 HD</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #020307;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #f3f4f6;
        }

        #webglContainer {
            position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 1; cursor: grab;
        }
        #webglContainer:active { cursor: grabbing; }

        .lens-vignette {
            position: fixed; inset: 0; pointer-events: none; z-index: 2;
            background: radial-gradient(circle at center, transparent 60%, rgba(0, 5, 15, 0.85) 100%);
            box-shadow: inset 0 0 80px rgba(0, 229, 255, 0.12);
        }

        .hud-top {
            position: fixed; top: 0; left: 0; right: 0; z-index: 10;
            padding: 15px 28px; display: flex; justify-content: space-between; align-items: center;
            background: linear-gradient(180deg, rgba(4, 8, 20, 0.85) 0%, transparent 100%);
            pointer-events: none;
        }
        .hud-top > * { pointer-events: auto; }
        .brand-box { display: flex; align-items: center; gap: 12px; }
        .brand-title {
            font-size: 1.35rem; font-weight: 800; color: #ff5722;
            letter-spacing: 2px; text-shadow: 0 0 15px rgba(255, 87, 34, 0.6);
        }
        .ver-tag {
            background: #00e5ff; color: #020617; font-size: 0.72rem; font-weight: bold;
            padding: 3px 9px; border-radius: 10px; box-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
        }
        .altitude-badge {
            font-family: monospace; background: rgba(0, 229, 255, 0.12);
            border: 1px solid rgba(0, 229, 255, 0.4); color: #00e5ff;
            padding: 4px 10px; border-radius: 6px; font-size: 0.85rem;
        }
        .stats-hud {
            display: flex; gap: 20px; background: rgba(10, 16, 32, 0.82);
            border: 1px solid rgba(255, 255, 255, 0.15); padding: 8px 18px;
            border-radius: 30px; backdrop-filter: blur(8px); font-size: 0.9rem;
        }
        .stats-hud b { color: #00e5ff; }

        .bora-hud {
            position: fixed; bottom: 24px; left: 24px; z-index: 10;
            width: 430px; max-width: calc(100vw - 48px);
            background: rgba(10, 16, 34, 0.88); border: 1px solid rgba(0, 229, 255, 0.5);
            border-radius: 16px; padding: 16px 20px; backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), 0 0 20px rgba(0, 229, 255, 0.15);
            display: flex; gap: 15px; align-items: flex-start;
        }
        .bora-holo-avatar {
            width: 54px; height: 54px; border-radius: 50%;
            background: radial-gradient(circle at 50% 30%, #ff80ab, #651fff);
            border: 2px solid #00e5ff; display: flex; justify-content: center; align-items: center;
            font-size: 1.7rem; flex-shrink: 0; box-shadow: 0 0 15px #00e5ff;
        }
        .bora-content h4 {
            margin: 0 0 5px 0; color: #00e5ff; font-size: 0.9rem;
            display: flex; justify-content: space-between;
        }
        .bora-content p { margin: 0; font-size: 0.88rem; line-height: 1.5; color: #e2e8f0; }

        .control-hud {
            position: fixed; bottom: 24px; right: 24px; z-index: 10;
            width: 450px; max-width: calc(100vw - 48px);
            background: rgba(12, 18, 36, 0.9); border: 1px solid rgba(255, 87, 34, 0.55);
            border-radius: 16px; padding: 18px 22px; backdrop-filter: blur(12px);
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.8);
        }
        .panel-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px;
        }
        .panel-title { font-weight: bold; color: #ffab91; font-size: 1rem; }
        .btn-zoom-out {
            background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.3);
            color: #fff; padding: 5px 12px; border-radius: 6px; font-size: 0.8rem;
            cursor: pointer; display: none;
        }
        .btn-zoom-out:hover { background: #ff5722; border-color: #ff5722; }

        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .holo-btn {
            background: rgba(20, 30, 55, 0.9); border: 1px solid #00e5ff; color: #fff;
            padding: 10px 12px; border-radius: 10px; cursor: pointer; text-align: left;

        }
        .holo-btn:hover {
            background: rgba(0, 229, 255, 0.2); transform: translateY(-2px);

        #markersLayer { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
        .spatial-marker {

        }
        .spatial-marker:hover { transform: translate(-50%, -50%) scale(1.15); z-index: 20; }
        .region-pin {
            background: rgba(5, 10, 24, 0.88); border: 2px solid #00e5ff; color: #fff;

        .region-pin.city { border-color: #f59e0b; box-shadow: 0 0 20px rgba(245, 158, 11, 0.6); }

        .plot-grid-box {

        }

        .plot-grid-box.owned {

        .btn-primary {

        .btn-coin {

        }
        .time-btn.active { background: #00e5ff; color: #000; font-weight: bold; border-color: #00e5ff; }
    </style>
</head>

    <script>
        let myBalance = 10000;

        let currentZoomStage = 1;
        let activeRegion = null;
        let activePlot = null;
        let currentTimelineMode = 'current';

        const marsRegions = [
            {

                    { id: 'RV-02', name: '강변 녹지 A-02호(대형)', dLat: 4, dLon: 5, price: 1300, canFree: true, owner: null, status: 'none', level: 1, desc: '강물 취수가 가장 유리한 특급 명당' },
                    { id: 'RV-03', name: '강변 숲 구역 A-03호(대형)', dLat: -4, dLon: -4, price: 1100, canFree: true, owner: null, status: 'none', level: 1, desc: '대규모 산소 돔 및 생태 농장 부지' },
                    { id: 'RV-04', name: '강변 삼각주 A-04호(대형)', dLat: -3.5, dLon: 6, price: 1500, canFree: true, owner: null, status: 'none', level: 1, desc: '두 강줄기가 합류하는 비옥한 삼각주' }
                ]
            },
            {
                id: 'greenvalley',
                name: '🌲 그린밸리 대평원',
                sub: '넓은 땅 · 30일 무상임대',
                type: 'free',
                lat: -16, lon: 35,
                boraMsg: '“그린밸리 대평원 상공입니다, 사장님! 푸른 숲과 호수가 어우러진 대형 녹지 구획들이에요. 마음에 드는 구획을 골라보세요!”',
                plots: [
                    { id: 'GV-01', name: '그린밸리 B-01호(대형)', dLat: 3.5, dLon: -4.5, price: 1000, canFree: true, owner: null, status: 'none', level: 1, desc: '태양광 발전 및 대평원 복합 단지' },
                    { id: 'GV-02', name: '오아시스 B-02호(대형)', dLat: 3, dLon: 5, price: 1400, canFree: true, owner: null, status: 'none', level: 1, desc: '천연 지하수 호수를 품은 핵심 녹지' },
                    { id: 'GV-03', name: '그린밸리 남단 B-03호(대형)', dLat: -4, dLon: 0, price: 1100, canFree: true, owner: null, status: 'none', level: 1, desc: '테라포밍 산림 공원 예정 구역' }
                ]
            },
            {
                id: 'coastal',
                name: '🌊 코스탈 베이 해안도시',
                sub: '소형 알짜 · $REDM 코인 전용',
                type: 'city',
                lat: 20, lon: 40,
                boraMsg: '“푸른 바다와 해안선이 펼쳐진 코스탈 베이 해안도시 상공이에요! 여긴 중요 도시 구역이라 무상임대 없이 <b>$REDM 코인 정식 분양</b>으로만 선점하실 수 있어요!”',
                plots: [
                    { id: 'CB-01', name: '오션뷰 하버 C-01호(소형)', dLat: 3, dLon: -4, price: 2500, canFree: false, owner: null, status: 'none', level: 1, desc: '바다 조망권 1열 최고급 해안 상업지' },
                    { id: 'CB-02', name: '마리나 부두 C-02호(소형)', dLat: 3.5, dLon: 4.5, price: 2800, canFree: false, owner: null, status: 'none', level: 1, desc: '해상 교역선 중심 항만 노른자위 땅' },
                    { id: 'CB-03', name: '선셋 비치 C-03호(소형)', dLat: -3.5, dLon: 1, price: 2400, canFree: false, owner: null, status: 'none', level: 1, desc: '해안 휴양 돔 복합 개발 지구' }
                ]
            },
            {
                id: 'olympus',
                name: '🏙️ 올림푸스 센트럴 시티',
                sub: '초밀집 도심 · $REDM 코인 전용',
                type: 'city',
                lat: -12, lon: -38,
                boraMsg: '“화성의 수도 올림푸스 센트럴 시티 상공입니다! 행정과 금융이 집중된 핵심지라 오직 <b>$REDM 코인</b>으로만 영구 분양이 가능합니다!”',
                plots: [
                    { id: 'OL-01', name: '센트럴 광장 D-01호(소형)', dLat: 3, dLon: -4, price: 3200, canFree: false, owner: null, status: 'none', level: 1, desc: '중앙 광장 바로 앞 초특급 랜드마크 부지' },
                    { id: 'OL-02', name: '테크 타워 D-02호(소형)', dLat: 3, dLon: 4.5, price: 3000, canFree: false, owner: null, status: 'none', level: 1, desc: '우주 엘리베이터 및 통신 본부 인접지' },
                    { id: 'OL-03', name: '메트로 역세권 D-03호(소형)', dLat: -3.5, dLon: 0, price: 2700, canFree: false, owner: null, status: 'none', level: 1, desc: '자기부상열차 중앙역 환승 특구' }
                ]
            }
        ];

        let scene, camera, renderer, planetGroup, marsMesh;
        // 3단계에서 시기별로 보여줄 3가지 정밀 3D 레이어
        let stage3Root, currentBaseGroup, lastWeekGroup, wastelandGroup, upgradeBuildingsGroup;
        let radarDish, roverMesh, beaconLaser, craneArm;
        const PLANET_RADIUS = 10;

        let camPos = new THREE.Vector3(0, 0, 28);
        let targetCamPos = new THREE.Vector3(0, 0, 28);
        let camLook = new THREE.Vector3(0, 0, 0);
        let targetCamLook = new THREE.Vector3(0, 0, 0);

        let currentRotX = 0.15, currentRotY = 0;
        let targetRotX = 0.15, targetRotY = 0;
        let autoRotate = true;
        let animTick = 0;

        function latLonToVector3(lat, lon, radius) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lon + 90) * (Math.PI / 180);
            const x = -radius * Math.sin(phi) * Math.cos(theta);
            const z = radius * Math.sin(phi) * Math.sin(theta);
            const y = radius * Math.cos(phi);
            return new THREE.Vector3(x, y, z);
        }

        // ★ 뿌옇게 번지던 노란 격자선을 텍스처에서 완전히 제거하고 깨끗한 자연 지형만 렌더링!
        function generateCleanMarsTexture(mode = 'current') {
            const canvas = document.createElement('canvas');
            canvas.width = 2048;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            const bgGrad = ctx.createLinearGradient(0, 0, 0, 1024);
            if (mode === 'lastMonth') {
                bgGrad.addColorStop(0, '#3b1109');
                bgGrad.addColorStop(0.5, '#7c2412');
                bgGrad.addColorStop(1, '#260904');
            } else {
                bgGrad.addColorStop(0, '#4a150b');
                bgGrad.addColorStop(0.5, '#9a3412');
                bgGrad.addColorStop(1, '#2e0c05');
            }
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, 2048, 1024);

            for (let i = 0; i < 240; i++) {
                const x = Math.random() * 2048;
                const y = Math.random() * 1024;
                const r = Math.random() * 55 + 10;
                const g = ctx.createRadialGradient(x, y, r * 0.1, x, y, r);
                g.addColorStop(0, i % 2 === 0 ? 'rgba(30, 8, 4, 0.35)' : 'rgba(234, 88, 12, 0.22)');
                g.addColorStop(1, 'transparent');
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            }

            if (mode === 'lastMonth') return new THREE.CanvasTexture(canvas);

            const alpha = mode === 'lastWeek' ? 0.45 : 0.95;

            marsRegions.forEach(reg => {
                const u = ((reg.lon + 180) / 360) * 2048;
                const v = ((90 - reg.lat) / 180) * 1024;

                const greenGrad = ctx.createRadialGradient(u, v, 10, u, v, 190);
                greenGrad.addColorStop(0, `rgba(16, 185, 129, ${0.72 * alpha})`);
                greenGrad.addColorStop(0.55, `rgba(5, 150, 105, ${0.42 * alpha})`);
                greenGrad.addColorStop(1, 'transparent');
                ctx.fillStyle = greenGrad;
                ctx.beginPath();
                ctx.arc(u, v, 190, 0, Math.PI * 2);
                ctx.fill();

                for (let step = -120; step <= 120; step += 8) {
                    const wx = u + step;
                    const wy = v + Math.sin(step * 0.035) * 38 + (step * 0.25);
                    const radius = (1 - Math.abs(step) / 135) * 24 + 4;
                    const wGrad = ctx.createRadialGradient(wx, wy, 1, wx, wy, radius);
                    wGrad.addColorStop(0, `rgba(56, 189, 248, ${0.88 * alpha})`);
                    wGrad.addColorStop(0.6, `rgba(2, 132, 199, ${0.6 * alpha})`);
                    wGrad.addColorStop(1, 'transparent');
                    ctx.fillStyle = wGrad;
                    ctx.beginPath();
                    ctx.arc(wx, wy, radius, 0, Math.PI * 2);
                    ctx.fill();
                }

                if (reg.id === 'coastal') {
                    const seaGrad = ctx.createRadialGradient(u + 60, v - 35, 15, u + 60, v - 35, 145);
                    seaGrad.addColorStop(0, `rgba(3, 105, 161, ${alpha})`);
                    seaGrad.addColorStop(0.6, `rgba(14, 165, 233, ${0.75 * alpha})`);
                    seaGrad.addColorStop(1, 'transparent');
                    ctx.fillStyle = seaGrad;
                    ctx.beginPath();
                    ctx.arc(u + 60, v - 35, 145, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            return new THREE.CanvasTexture(canvas);
        }

        // ★ 3단계 초근접 지형(현재 기지 + 지난주 공사장 + 지난달 3D 바위 황무지) 통합 생성!
        function createStage3Environment() {
            const root = new THREE.Group();
            root.position.set(0, 0, PLANET_RADIUS);

            const surface = new THREE.Group();
            surface.rotation.x = Math.PI / 2;
            root.add(surface);

            // [공통 외곽 지형] 기지 주변을 둘러싼 입체 화성 바위 언덕 18개 (현재/과거 모두 밋밋함 방지!)
            const rockMat = new THREE.MeshStandardMaterial({ color: 0x7c2d12, roughness: 0.9, flatShading: true });
            for (let i = 0; i < 18; i++) {
                const ang = (i / 18) * Math.PI * 2 + (i % 3) * 0.2;
                const dist = 0.44 + (i % 4) * 0.08;
                const size = 0.025 + (i % 3) * 0.018;
                const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(size, 0), rockMat);
                rock.position.set(Math.cos(ang) * dist, size * 0.5, Math.sin(ang) * dist);
                rock.rotation.set(i, i * 2, 0);
                rock.scale.set(1.3, 0.75, 1.1);
                surface.add(rock);
            }

            // =========================================================================
            // A. [현재 푸른 기지] 그룹 (currentBaseGroup)
            // =========================================================================
            currentBaseGroup = new THREE.Group();
            surface.add(currentBaseGroup);

            const gridHelper = new THREE.PolarGridHelper(0.58, 16, 7, 64, 0x00e5ff, 0x10b981);
            gridHelper.position.y = 0.004;
            currentBaseGroup.add(gridHelper);

            // 기지 옆을 흐르는 선명한 3D 테라포밍 운하(수로) 물길과 교량
            const canalWater = new THREE.Mesh(
                new THREE.BoxGeometry(0.95, 0.008, 0.11),
                new THREE.MeshStandardMaterial({ color: 0x0ea5e9, emissive: 0x0284c7, emissiveIntensity: 0.35, roughness: 0.15 })
            );
            canalWater.position.set(0, 0.004, -0.34);
            canalWater.rotation.y = -0.18;
            currentBaseGroup.add(canalWater);

            // 착륙 패드 & 생태 잔디 공원
            const pad = new THREE.Mesh(
                new THREE.CylinderGeometry(0.26, 0.29, 0.02, 32),
                new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.5, roughness: 0.4 })
            );
            pad.position.y = 0.01;
            currentBaseGroup.add(pad);

            const lawn = new THREE.Mesh(
                new THREE.CylinderGeometry(0.18, 0.18, 0.024, 32),
                new THREE.MeshStandardMaterial({ color: 0x059669, roughness: 0.8 })
            );
            lawn.position.y = 0.012;
            currentBaseGroup.add(lawn);

            // 중앙 메인 지오데식 생태 산소 돔
            const mainDomeMat = new THREE.MeshStandardMaterial({
                color: 0x38bdf8, transparent: true, opacity: 0.42, roughness: 0.15, metalness: 0.2
            });
            const mainDome = new THREE.Mesh(
                new THREE.SphereGeometry(0.16, 24, 16, 0, Math.PI * 2, 0, Math.PI / 2),
                mainDomeMat
            );
            mainDome.position.y = 0.015;
            currentBaseGroup.add(mainDome);

            const wireMat = new THREE.MeshBasicMaterial({ color: 0x00e5ff, wireframe: true, transparent: true, opacity: 0.8 });
            const wireDome = new THREE.Mesh(
                new THREE.SphereGeometry(0.162, 12, 8, 0, Math.PI * 2, 0, Math.PI / 2),
                wireMat
            );
            wireDome.position.y = 0.015;
            currentBaseGroup.add(wireDome);

            // 돔 내부 마천루 빌딩 6개 + 초록 숲 나무 8그루
            for (let i = 0; i < 6; i++) {
                const bH = 0.05 + (i % 3) * 0.03;
                const bMesh = new THREE.Mesh(
                    new THREE.BoxGeometry(0.025, bH, 0.025),
                    new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x0284c7, emissiveIntensity: 0.6 })
                );
                const angle = (i / 5) * Math.PI * 2;
                const r = i === 0 ? 0 : 0.058;
                bMesh.position.set(Math.cos(angle) * r, 0.015 + bH / 2, Math.sin(angle) * r);
                currentBaseGroup.add(bMesh);
            }
            for (let t = 0; t < 8; t++) {
                const tang = (t / 8) * Math.PI * 2 + 0.3;
                const tree = new THREE.Mesh(
                    new THREE.ConeGeometry(0.016, 0.04, 6),
                    new THREE.MeshStandardMaterial({ color: 0x10b981, flatShading: true })
                );
                tree.position.set(Math.cos(tang) * 0.115, 0.035, Math.sin(tang) * 0.115);
                currentBaseGroup.add(tree);
            }

            // 주변 3개 보조 바이오 돔 + 연결 터널
            [-0.6, 2.5, 3.8].forEach(ang => {
                const dist = 0.23;
                const sx = Math.cos(ang) * dist;
                const sz = Math.sin(ang) * dist;

                const subDome = new THREE.Mesh(new THREE.SphereGeometry(0.065, 16, 12, 0, Math.PI * 2, 0, Math.PI / 2), mainDomeMat);
                subDome.position.set(sx, 0.012, sz);
                currentBaseGroup.add(subDome);

                const subWire = new THREE.Mesh(new THREE.SphereGeometry(0.067, 8, 6, 0, Math.PI * 2, 0, Math.PI / 2), wireMat);
                subWire.position.set(sx, 0.012, sz);
                currentBaseGroup.add(subWire);

                const tunnel = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.018, 0.024), new THREE.MeshStandardMaterial({ color: 0x94a3b8 }));
                tunnel.position.set(sx * 0.65, 0.02, sz * 0.65);
                tunnel.rotation.y = -ang;
                currentBaseGroup.add(tunnel);
            });

            // 채굴 타워 & 회전 레이더 & 순찰 로버
            const tower = new THREE.Mesh(
                new THREE.CylinderGeometry(0.012, 0.028, 0.22, 12),
                new THREE.MeshStandardMaterial({ color: 0xff5722, emissive: 0x9a3412, emissiveIntensity: 0.7 })
            );
            tower.position.set(0.19, 0.12, 0.08);
            currentBaseGroup.add(tower);

            radarDish = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.014, 0.02), new THREE.MeshBasicMaterial({ color: 0x00e5ff }));
            radarDish.position.set(0.19, 0.235, 0.08);
            currentBaseGroup.add(radarDish);

            roverMesh = new THREE.Mesh(new THREE.BoxGeometry(0.038, 0.022, 0.052), new THREE.MeshBasicMaterial({ color: 0xfacc15 }));
            roverMesh.position.set(0.35, 0.02, 0);
            currentBaseGroup.add(roverMesh);

            // [🏗️ 증축] 버튼 클릭 시 실시간으로 추가될 레벨업 건물 그룹 (태양광 발전 단지, 서브 원자로 등)
            upgradeBuildingsGroup = new THREE.Group();
            currentBaseGroup.add(upgradeBuildingsGroup);

            // =========================================================================
            // B. [지난주 수로공사] 전용 기초 공사장 그룹 (lastWeekGroup)
            // =========================================================================
            lastWeekGroup = new THREE.Group();
            lastWeekGroup.visible = false;
            surface.add(lastWeekGroup);

            const workGrid = new THREE.PolarGridHelper(0.45, 12, 5, 32, 0xf59e0b, 0x78350f);
            workGrid.position.y = 0.004;
            lastWeekGroup.add(workGrid);

            // 기초 철골 돔 뼈대 (유리 없이 철골만 올라간 상태)
            const frameDome = new THREE.Mesh(
                new THREE.SphereGeometry(0.13, 10, 6, 0, Math.PI * 2, 0, Math.PI / 2),
                new THREE.MeshBasicMaterial({ color: 0xfbbf24, wireframe: true })
            );
            frameDome.position.y = 0.01;
            lastWeekGroup.add(frameDome);

            // 회전하는 노란 타워 크레인
            const craneMast = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.24, 0.02), new THREE.MeshStandardMaterial({ color: 0xf59e0b }));
            craneMast.position.set(-0.14, 0.12, 0);
            lastWeekGroup.add(craneMast);

            craneArm = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.015, 0.015), new THREE.MeshBasicMaterial({ color: 0xfacc15 }));
            craneArm.position.set(-0.14, 0.23, 0);
            lastWeekGroup.add(craneArm);

            // =========================================================================
            // C. [지난달 황무지] 전용 3D 원시 암석·크레이터·측량 비콘 그룹 (wastelandGroup)
            // =========================================================================
            wastelandGroup = new THREE.Group();
            wastelandGroup.visible = false;
            surface.add(wastelandGroup);

            // 중앙 원시 운석 충돌 크레이터(분화구 링)
            const craterRim = new THREE.Mesh(
                new THREE.TorusGeometry(0.22, 0.028, 12, 32),
                new THREE.MeshStandardMaterial({ color: 0x6b210b, roughness: 0.95, flatShading: true })
            );
            craterRim.rotation.x = Math.PI / 2;
            craterRim.scale.set(1, 1, 0.45);
            craterRim.position.y = 0.008;
            wastelandGroup.add(craterRim);

            // 크레이터 주변에 흩어진 거친 3D 화성 바위 12개
            for (let r = 0; r < 12; r++) {
                const a = (r / 12) * Math.PI * 2;
                const d = 0.08 + (r % 3) * 0.09;
                const s = 0.018 + (r % 4) * 0.012;
                const boulder = new THREE.Mesh(new THREE.DodecahedronGeometry(s, 0), rockMat);
                boulder.position.set(Math.cos(a) * d, s * 0.5, Math.sin(a) * d);
                boulder.rotation.set(r, r * 1.5, 0);
                wastelandGroup.add(boulder);
            }

            // "미개척 토지 좌표"를 표시하는 붉은 홀로그램 측량 레이저 말뚝(비콘)과 구획선
            const surveyGrid = new THREE.PolarGridHelper(0.32, 8, 3, 32, 0xef4444, 0x7f1d1d);
            surveyGrid.position.y = 0.004;
            wastelandGroup.add(surveyGrid);

            beaconLaser = new THREE.Mesh(
                new THREE.CylinderGeometry(0.008, 0.008, 0.35, 8),
                new THREE.MeshBasicMaterial({ color: 0xff3d00, transparent: true, opacity: 0.85 })
            );
            beaconLaser.position.set(0, 0.175, 0);
            wastelandGroup.add(beaconLaser);

            return root;
        }

        // [🏗️ 증축]을 누를 때마다 태양광 패널 단지, 보조 발전기 등이 실제로 하나씩 건설됨!
        function rebuildUpgradeStructures(level) {
            while (upgradeBuildingsGroup.children.length > 0) {
                upgradeBuildingsGroup.remove(upgradeBuildingsGroup.children[0]);
            }
            const count = Math.min(8, level - 1);
            for (let i = 0; i < count; i++) {
                const ang = (i / 8) * Math.PI * 2 + 0.5;
                const dist = 0.36;
                const gx = Math.cos(ang) * dist;
                const gz = Math.sin(ang) * dist;

                // 파란 태양광 발전소 윙 + 미니 에너지 코어
                const solarWing = new THREE.Mesh(
                    new THREE.BoxGeometry(0.08, 0.006, 0.05),
                    new THREE.MeshStandardMaterial({ color: 0x1d4ed8, emissive: 0x1e40af, emissiveIntensity: 0.5, metalness: 0.8 })
                );
                solarWing.position.set(gx, 0.025, gz);
                solarWing.rotation.x = 0.25;
                solarWing.rotation.y = -ang;
                upgradeBuildingsGroup.add(solarWing);
            }
        }

        function initWorld() {
            const container = document.getElementById('webglContainer');
            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.copy(camPos);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xdbeafe, 0.75));
            const sun = new THREE.DirectionalLight(0xfff1e6, 1.35);
            sun.position.set(18, 22, 28);
            scene.add(sun);

            planetGroup = new THREE.Group();
            scene.add(planetGroup);

            const marsGeo = new THREE.SphereGeometry(PLANET_RADIUS, 128, 128);
            const tex = generateCleanMarsTexture('current');
            const marsMat = new THREE.MeshStandardMaterial({
                map: tex, roughness: 0.82, metalness: 0.06
            });
            marsMesh = new THREE.Mesh(marsGeo, marsMat);
            planetGroup.add(marsMesh);

            const atmosGeo = new THREE.SphereGeometry(PLANET_RADIUS + 0.32, 64, 64);
            const atmosMat = new THREE.MeshBasicMaterial({
                color: 0x38bdf8, transparent: true, opacity: 0.14, side: THREE.BackSide
            });
            planetGroup.add(new THREE.Mesh(atmosGeo, atmosMat));

            stage3Root = createStage3Environment();
            stage3Root.visible = false;
            scene.add(stage3Root);

            const starGeo = new THREE.BufferGeometry();
            const starPos = new Float32Array(2000 * 3);
            for (let i = 0; i < 2000 * 3; i++) starPos[i] = (Math.random() - 0.5) * 180;
            starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
            scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.12 })));

            let dragging = false;
            let prev = { x: 0, y: 0 };
            container.addEventListener('mousedown', e => {
                dragging = true; autoRotate = false; prev = { x: e.clientX, y: e.clientY };
            });
            window.addEventListener('mouseup', () => dragging = false);
            window.addEventListener('mousemove', e => {
                if (!dragging || currentZoomStage === 3) return;
                const speed = currentZoomStage === 1 ? 0.005 : 0.0018;
                targetRotY += (e.clientX - prev.x) * speed;
                targetRotX = Math.max(-1.2, Math.min(1.2, targetRotX + (e.clientY - prev.y) * speed));
                prev = { x: e.clientX, y: e.clientY };
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            buildSpatialMarkers();
            renderControlPanel();
            animateLoop();
        }

        const domMarkers = [];

        function buildSpatialMarkers() {
            const layer = document.getElementById('markersLayer');
            layer.innerHTML = '';
            domMarkers.length = 0;

            marsRegions.forEach(reg => {
                const pinEl = document.createElement('div');
                pinEl.className = `spatial-marker region-pin ${reg.type}`;
                pinEl.innerHTML = `${reg.name} <div style="font-size:0.68rem; font-weight:normal; opacity:0.85;">${reg.sub}</div>`;
                pinEl.onclick = () => zoomToStage2(reg);
                layer.appendChild(pinEl);

                domMarkers.push({
                    stage: 1, regionId: reg.id, el: pinEl,
                    localPos: latLonToVector3(reg.lat, reg.lon, PLANET_RADIUS + 0.15)
                });

                reg.plots.forEach(plot => {
                    const boxEl = document.createElement('div');
                    boxEl.id = `marker-${plot.id}`;
                    boxEl.className = `spatial-marker plot-grid-box ${reg.type === 'city' ? 'city-plot' : ''} ${plot.owner ? 'owned' : ''}`;
                    updatePlotMarkerText(boxEl, plot);
                    boxEl.onclick = () => selectPlotIn3D(reg, plot);
                    layer.appendChild(boxEl);

                    domMarkers.push({
                        stage: 2, regionId: reg.id, plotId: plot.id, el: boxEl,
                        localPos: latLonToVector3(reg.lat + plot.dLat, reg.lon + plot.dLon, PLANET_RADIUS + 0.05)
                    });
                });
            });
        }

        function updatePlotMarkerText(el, plot) {
            let tag = plot.canFree ? (hasUsedFreeLease ? `${plot.price} REDM` : `🎁 30일 무상임대`) : `💎 ${plot.price} REDM`;
            if (plot.status === 'leased') tag = `🕒 사장님 임대중(D-30)`;
            if (plot.status === 'owned') tag = `👑 사장님 영구소유`;
            el.className = `spatial-marker plot-grid-box ${!plot.canFree ? 'city-plot' : ''} ${plot.owner ? 'owned' : ''}`;
            el.innerHTML = `<b>${plot.name}</b><span>${tag}</span>`;
        }

        function syncMarkersWith3DGlobe() {
            domMarkers.forEach(m => {
                if (currentZoomStage === 1 && m.stage !== 1) { m.el.style.display = 'none'; return; }
                if (currentZoomStage === 2 && (m.stage !== 2 || m.regionId !== activeRegion.id)) { m.el.style.display = 'none'; return; }
                if (currentZoomStage === 3) { m.el.style.display = 'none'; return; }

                const worldPos = m.localPos.clone().applyEuler(planetGroup.rotation);
                if (worldPos.z < 2.5) { m.el.style.display = 'none'; return; }

                const projected = worldPos.clone().project(camera);
                const x = (projected.x * 0.5 + 0.5) * window.innerWidth;
                const y = (-(projected.y * 0.5) + 0.5) * window.innerHeight;

                m.el.style.display = 'flex';
                m.el.style.left = `${x}px`;
                m.el.style.top = `${y}px`;
            });
        }

        function aimGlobeAt(lat, lon) {
            autoRotate = false;
            targetRotX = lat * (Math.PI / 180);
            targetRotY = -lon * (Math.PI / 180);
        }

        function zoomToStage2(region) {
            currentZoomStage = 2;
            activeRegion = region;
            activePlot = null;
            stage3Root.visible = false;

            aimGlobeAt(region.lat, region.lon);
            targetCamPos.set(0, 0, 13.5);
            targetCamLook.set(0, 0, 0);

            document.getElementById('boraSpeech').innerHTML = region.boraMsg;
            document.getElementById('btnZoomOut').style.display = 'block';
            renderControlPanel();
        }

        function selectPlotIn3D(region, plot) {
            activePlot = plot;
            aimGlobeAt(region.lat + plot.dLat, region.lon + plot.dLon);
            targetCamPos.set(0, 0, 12.3);
            targetCamLook.set(0, 0, 0);

            if (plot.owner) {
                document.getElementById('boraSpeech').innerHTML = `“사장님의 영토인 <b>[${plot.name}]</b>입니다! 오른쪽 아래의 <b>[🚀 드론 기지 뷰로 착륙하기]</b>를 누르면 초정밀 3D 기지 단지가 펼쳐져요!”`;
            } else if (plot.canFree) {
                if (!hasUsedFreeLease) {
                    document.getElementById('boraSpeech').innerHTML = `“사장님, <b>[${plot.name}]</b> 위치가 정말 끝내줘요! 첫 녹지 혜택으로 <b>30일간 비용 없이 무상임대</b>를 받아 바로 개척해 보시겠어요?”`;
                } else {
                    document.getElementById('boraSpeech').innerHTML = `“사장님, 1인당 1회 무상임대 혜택은 이미 사용하셔서, 이 땅을 추가로 확보하시려면 <b>${plot.price.toLocaleString()} REDM 코인</b>으로 정식 분양을 받으셔야 해요!”`;
                }
            } else {
                document.getElementById('boraSpeech').innerHTML = `“핵심 도시 구역인 <b>[${plot.name}]</b>을 고르셨네요! 여긴 중요 지역이라 무상임대 없이 <b>${plot.price.toLocaleString()} REDM 코인</b>으로만 영구 분양받으실 수 있어요!”`;
            }
            renderControlPanel();
        }

        function zoomToStage3Base(plot) {
            currentZoomStage = 3;
            const lat = activeRegion.lat + plot.dLat;
            const lon = activeRegion.lon + plot.dLon;

            aimGlobeAt(lat, lon);
            rebuildUpgradeStructures(plot.level);

            stage3Root.visible = true;
            applyTimelineLayer('current');

            targetCamPos.set(0, -0.78, 10.98);
            targetCamLook.set(0, 0.08, PLANET_RADIUS);

            document.getElementById('boraSpeech').innerHTML = `“<b>[${plot.name}]</b> 드론 조망 뷰로 착륙했어요! 기지 뒤편으로 흐르는 <b>3D 푸른 운하 물길과 외곽 화성 바위 언덕</b>까지 선명하게 보이죠? <b>[📜 지난달 황무지]</b>나 <b>[🏗️ 증축]</b>도 눌러보세요!”`;
            renderControlPanel();
        }

        function stepZoomOut() {
            if (currentZoomStage === 3) {
                zoomToStage2(activeRegion);
            } else {
                currentZoomStage = 1;
                activeRegion = null;
                activePlot = null;
                stage3Root.visible = false;
                targetCamPos.set(0, 0, 28);
                targetCamLook.set(0, 0, 0);
                autoRotate = true;
                document.getElementById('btnZoomOut').style.display = 'none';
                document.getElementById('boraSpeech').innerHTML = `“다시 우주 궤도로 줌아웃했습니다, 사장님! 둥근 화성을 돌려보며 다른 대륙이나 해안 도시도 클릭해 보세요.”`;
                renderControlPanel();
            }
        }

        function claimFreeLease() {
            if (!activePlot) return;
            if (hasUsedFreeLease) {
                alert(`❗ [무상임대 거절 안내]\n\n보라: "사장님! 30일 무상임대 혜택은 한 아이디당 1곳만 제공됩니다.\n이 토지를 원하시면 $REDM 코인을 지불해 정식 분양을 받아주세요!"`);
                return;
            }
            hasUsedFreeLease = true;
            activePlot.owner = "사장님";
            activePlot.status = "leased";
            updatePlotMarkerText(document.getElementById(`marker-${activePlot.id}`), activePlot);
            updateTopHUD();
            alert(`🎉 [${activePlot.name}] 30일 무상임대 완료!\n이제 드론 기지 뷰로 착륙해 전경을 감상해 보세요!`);
            zoomToStage3Base(activePlot);
        }

        function buyPlotWithCoin() {
            if (!activePlot) return;
            if (myBalance < activePlot.price) {
                alert("❌ 보유하신 $REDM 코인이 부족합니다!");
                return;
            }
            myBalance -= activePlot.price;
            burnedCoin += Math.floor(activePlot.price * 0.1);
            activePlot.owner = "사장님";
            activePlot.status = "owned";
            updatePlotMarkerText(document.getElementById(`marker-${activePlot.id}`), activePlot);
            updateTopHUD();
            alert(`👑 [${activePlot.name}] 영구 소유 등기 완료!`);
            zoomToStage3Base(activePlot);
        }

        function runBaseWork(workName, reward, isUpgrade = false) {
            myBalance += reward;
            updateTopHUD();

            if (currentTimelineMode !== 'current') {
                const firstBtn = document.querySelector('.time-btn');
                if (firstBtn) change3DTimeline('current', firstBtn);
            }

            if (isUpgrade && activePlot) {
                activePlot.level = (activePlot.level || 1) + 1;
                rebuildUpgradeStructures(activePlot.level);
                renderControlPanel();
            }

            currentBaseGroup.scale.set(1.15, 1.15, 1.15);
            setTimeout(() => currentBaseGroup.scale.set(1, 1, 1), 300);

            document.getElementById('boraSpeech').innerHTML = isUpgrade
                ? `“와아! <b>[기지 Lv.${activePlot.level} 증축 완료]</b> 기지 외곽에 새로운 <b>3D 태양광 발전 시설</b>이 추가로 건설되었어요! (+${reward} REDM 획득)”`
                : `“멋져요 사장님! <b>[${workName}]</b> 작업으로 <b>+${reward} REDM</b> 코인을 획득하셨습니다!”`;
        }

        function applyTimelineLayer(mode) {
            currentTimelineMode = mode;
            marsMesh.material.map = generateCleanMarsTexture(mode);
            marsMesh.material.needsUpdate = true;

            currentBaseGroup.visible = (mode === 'current');
            lastWeekGroup.visible = (mode === 'lastWeek');
            wastelandGroup.visible = (mode === 'lastMonth');
        }

        function change3DTimeline(mode, btn) {
            document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');

            applyTimelineLayer(mode);

            if (mode === 'current') {
                document.getElementById('boraSpeech').innerHTML = `“<b>[현재 모습]</b> 푸른 3D 운하 물길과 육각형 생태 돔, 태양광 발전소가 힘차게 가동 중이에요!”`;
            } else if (mode === 'lastWeek') {
                document.getElementById('boraSpeech').innerHTML = `“<b>[지난주 기록]</b> 노란 타워 크레인이 돌아가며 철골 돔 뼈대를 올리던 기초 공사 현장 모습입니다!”`;
            } else {
                document.getElementById('boraSpeech').innerHTML = `“<b>[지난달 황무지]</b> 개척 전, 거친 <b>3D 바위와 운석 분화구(크레이터), 붉은 측량 레이저 말뚝(비콘)</b>만 덩그러니 서 있던 원시 화성 땅바닥이에요!”`;
            }
        }

        function updateTopHUD() {
            document.getElementById('balanceText').innerText = myBalance.toLocaleString();
            document.getElementById('burnText').innerText = burnedCoin.toLocaleString();
            const t = document.getElementById('leaseTicketText');
            if (hasUsedFreeLease) {
                t.innerText = "사용 완료 (추가 토지는 코인 결제)";
                t.style.color = "#f59e0b";
            }
        }

        function renderControlPanel() {
            const titleEl = document.getElementById('panelTitle');
            const bodyEl = document.getElementById('panelBody');

            if (currentZoomStage === 1) {
                titleEl.innerText = "🔭 1단계: 클로즈업할 화성 지역 선택";
                bodyEl.innerHTML = `
                    <div class="btn-grid">
                        ${marsRegions.map(r => `
                            <button class="holo-btn ${r.type === 'free' ? 'free-tag' : 'city-tag'}" onclick="zoomToStage2ById('${r.id}')">
                                <b>${r.name}</b>
                                <small>${r.sub}</small>
                            </button>
                        `).join('')}
                    </div>
                `;
            } else if (currentZoomStage === 2) {
                titleEl.innerText = `📍 2단계: ${activeRegion.name}`;
                if (!activePlot) {
                    bodyEl.innerHTML = `<p style="margin:0; font-size:0.88rem; color:#cbd5e1;">👆 눈앞의 3D 화성 표면 위에 펼쳐진 <b>네모 구획(필지)</b>을 직접 클릭해 원하는 땅을 골라보세요!</p>`;
                } else {
                    let buttonsHtml = '';
                    if (activePlot.owner) {
                        if (activePlot.status === 'leased') {
                            buttonsHtml += `<button class="btn-coin" onclick="buyPlotWithCoin()">👑 영구 소유 전환 (${activePlot.price} REDM)</button>`;
                        }
                        buttonsHtml += `<button class="btn-primary" onclick="zoomToStage3Base(activePlot)">🚀 드론 기지 뷰로 착륙하기</button>`;
                    } else {
                        if (activePlot.canFree) {
                            buttonsHtml += `<button class="btn-primary" onclick="claimFreeLease()">🎁 30일 무상임대 (0 REDM)</button>`;
                        }
                        buttonsHtml += `<button class="btn-coin" onclick="buyPlotWithCoin()">💰 코인 영구 분양 (${activePlot.price} REDM)</button>`;
                    }

                    bodyEl.innerHTML = `
                        <div style="font-size:0.92rem; font-weight:bold; color:#00e5ff;">선택됨: ${activePlot.name}</div>
                        <div style="font-size:0.8rem; color:#94a3b8; margin-top:3px;">${activePlot.desc}</div>
                        <div class="action-row">${buttonsHtml}</div>
                    `;
                }
            } else if (currentZoomStage === 3) {
                titleEl.innerText = `🚀 3단계: ${activePlot.name} (기지 Lv.${activePlot.level || 1})`;
                bodyEl.innerHTML = `
                    <div class="timeline-row">
                        <button class="time-btn ${currentTimelineMode==='current'?'active':''}" onclick="change3DTimeline('current', this)">🟢 현재 푸른 기지</button>
                        <button class="time-btn ${currentTimelineMode==='lastWeek'?'active':''}" onclick="change3DTimeline('lastWeek', this)">⏳ 지난주 철골공사</button>
                        <button class="time-btn ${currentTimelineMode==='lastMonth'?'active':''}" onclick="change3DTimeline('lastMonth', this)">📜 지난달 바위황무지</button>
                    </div>
                    <div class="action-row">
                        <button class="btn-primary" onclick="runBaseWork('지하 수맥 탐사', 50, false)">🛰️ 탐사 (+50)</button>
                        <button class="btn-coin" onclick="runBaseWork('레드엠 코어 채굴', 120, false)">⛏️ 채굴 (+120)</button>
                        <button class="btn-primary" style="background:#00e5ff;" onclick="runBaseWork('태양광 단지 증축', 200, true)">🏗️ 시설증축 (+200)</button>
                    </div>
                `;
            }
        }

        function zoomToStage2ById(id) {
            const reg = marsRegions.find(r => r.id === id);
            if (reg) zoomToStage2(reg);
        }

        function animateLoop() {
            requestAnimationFrame(animateLoop);
            animTick += 0.03;

            if (autoRotate && currentZoomStage === 1) {
                targetRotY += 0.0012;
            }

            if (stage3Root && stage3Root.visible) {
                if (radarDish) radarDish.rotation.y += 0.05;
                if (roverMesh) {
                    roverMesh.position.set(Math.cos(animTick * 0.6) * 0.35, 0.02, Math.sin(animTick * 0.6) * 0.35);
                    roverMesh.rotation.y = -(animTick * 0.6);
                }
                if (craneArm) craneArm.rotation.y = Math.sin(animTick * 0.5) * 0.8;
                if (beaconLaser) beaconLaser.material.opacity = 0.45 + Math.sin(animTick * 3) * 0.4;
            }

            currentRotX += (targetRotX - currentRotX) * 0.07;
            currentRotY += (targetRotY - currentRotY) * 0.07;
            planetGroup.rotation.x = currentRotX;
            planetGroup.rotation.y = currentRotY;

            camPos.lerp(targetCamPos, 0.07);
            camLook.lerp(targetCamLook, 0.07);
            camera.position.copy(camPos);
            camera.lookAt(camLook);

            const km = currentZoomStage === 3 ? 2 : Math.max(15, Math.floor((camPos.z - 10.9) * 850));
            document.getElementById('altitudeDisplay').innerText = `고도: ${km.toLocaleString()} KM (${currentZoomStage === 1 ? '우주 궤도' : currentZoomStage === 2 ? '지역 상공 구획 뷰' : '지표면 HD 드론 뷰'})`;

            syncMarkersWith3DGlobe();
            renderer.render(scene, camera);
        }

        window.onload = initWorld;
    </script>
</body>
</html>
