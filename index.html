<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ares Terra ($REDM) - Fullscreen 3D Mars</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020307;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #f3f4f6;
        }

        /* 100% 풀스크린 3D 우주 캔버스 */
        #webglContainer {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            cursor: grab;
        }
        #webglContainer:active { cursor: grabbing; }

        /* 19세기 천체망원경 & 우주선 비네팅(가장자리 어두운 렌즈) 효과 */
        .lens-vignette {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 2;
            background: radial-gradient(circle at center, transparent 55%, rgba(0, 5, 15, 0.85) 100%);
            box-shadow: inset 0 0 80px rgba(0, 229, 255, 0.12);
        }

        /* 상단 반투명 홀로그램 HUD */
        .hud-top {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 10;
            padding: 15px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(180deg, rgba(4, 8, 20, 0.85) 0%, transparent 100%);
            pointer-events: none;
        }
        .hud-top > * { pointer-events: auto; }
        .brand-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .brand-title {
            font-size: 1.35rem;
            font-weight: 800;
            color: #ff5722;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(255, 87, 34, 0.6);
        }
        .altitude-badge {
            font-family: monospace;
            background: rgba(0, 229, 255, 0.12);
            border: 1px solid rgba(0, 229, 255, 0.4);
            color: #00e5ff;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
        }
        .stats-hud {
            display: flex;
            gap: 20px;
            background: rgba(10, 16, 32, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 8px 18px;
            border-radius: 30px;
            backdrop-filter: blur(8px);
            font-size: 0.9rem;
        }
        .stats-hud b { color: #00e5ff; }

        /* 좌측 하단: AI 보라 홀로그램 통신창 */
        .bora-hud {
            position: fixed;
            bottom: 24px;
            left: 24px;
            z-index: 10;
            width: 420px;
            max-width: calc(100vw - 48px);
            background: rgba(10, 16, 34, 0.82);
            border: 1px solid rgba(0, 229, 255, 0.5);
            border-radius: 16px;
            padding: 16px 20px;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), 0 0 20px rgba(0, 229, 255, 0.15);
            display: flex;
            gap: 15px;
            align-items: flex-start;
        }
        .bora-holo-avatar {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: radial-gradient(circle at 50% 30%, #ff80ab, #651fff);
            border: 2px solid #00e5ff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.7rem;
            flex-shrink: 0;
            box-shadow: 0 0 15px #00e5ff;
        }
        .bora-content h4 {
            margin: 0 0 5px 0;
            color: #00e5ff;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
        }
        .bora-content p {
            margin: 0;
            font-size: 0.88rem;
            line-height: 1.5;
            color: #e2e8f0;
        }

        /* 우측 하단: 단계별 네비게이션 및 토지 계약/기지 작업 컨트롤 패널 */
        .control-hud {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 10;
            width: 440px;
            max-width: calc(100vw - 48px);
            background: rgba(12, 18, 36, 0.85);
            border: 1px solid rgba(255, 87, 34, 0.5);
            border-radius: 16px;
            padding: 18px 22px;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.8);
        }
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 8px;
        }
        .panel-title {
            font-weight: bold;
            color: #ffab91;
            font-size: 1rem;
        }
        .btn-zoom-out {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.25);
            color: #fff;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            display: none;
        }
        .btn-zoom-out:hover { background: #ff5722; border-color: #ff5722; }

        /* 버튼 그리드 */
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .holo-btn {
            background: rgba(20, 30, 55, 0.9);
            border: 1px solid #00e5ff;

        .holo-btn:hover {

            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
        }
        .holo-btn.free-tag { border-color: #10b981; }
        .holo-btn.city-tag { border-color: #f59e0b; }
        .holo-btn small {
            display: block;
            font-size: 0.72rem;
            color: #94a3b8;
            margin-top: 3px;
        }

        /* 3D 공간 위를 따라다니는 동적 HTML 마커 (핀 & 토지 구획) */
        #markersLayer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 5;
        }
        .spatial-marker {
            position: absolute;
            transform: translate(-50%, -50%);
            pointer-events: auto;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.3s;
        }
        .spatial-marker:hover {
            transform: translate(-50%, -50%) scale(1.15);
            z-index: 20;
        }
        /* 1단계 대륙 핀 디자인 */
        .region-pin {
            background: rgba(5, 10, 24, 0.88);
            border: 2px solid #00e5ff;
            color: #fff;

            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: bold;

        .region-pin.city { border-color: #f59e0b; box-shadow: 0 0 20px rgba(245, 158, 11, 0.6); }

        /* 2단계 화성 표면 위 토지 구획(그리드) 마커 */
        .plot-grid-box {
            width: 110px;
            height: 75px;
            background: rgba(16, 185, 129, 0.28);
            border: 2px solid #10b981;
            border-radius: 8px;

            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            backdrop-filter: blur(2px);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
        }
        .plot-grid-box.city-plot {
            width: 85px;
            height: 60px;
            background: rgba(245, 158, 11, 0.28);

        /* 액션 버튼들 */
        .action-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
        .btn-primary {
            flex: 1; background: #10b981; color: #022c22; border: none; padding: 11px;
            border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.85rem;
        }
        .btn-coin {
            flex: 1; background: #ff5722; color: #fff; border: none; padding: 11px;
            border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.85rem;
        }
        .timeline-row {
            display: flex; gap: 6px; margin-top: 10px;
        }
        .time-btn {
            flex: 1; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2);
            color: #cbd5e1; padding: 7px; border-radius: 6px; font-size: 0.75rem; cursor: pointer;
        }
        .time-btn.active { background: #00e5ff; color: #000; font-weight: bold; border-color: #00e5ff; }
    </style>
</head>
<body>

    <!-- 100% 풀스크린 3D 우주 렌더링 영역 -->

        <div class="bora-holo-avatar">👩‍🚀</div>
        <div class="bora-content">
            <h4><span>AI 개척 파트너 보라</span> <span style="font-size:0.75rem; color:#10b981;">● LIVE 수신중</span></h4>

    <script>
        /* =====================================================================

        // 현재 줌 단계: 1(우주 전체), 2(지역 상공 구획 뷰), 3(내 땅 초근접 기지 뷰)

        let activeRegion = null;

                    { id: 'RV-02', name: '강변 녹지 A-02호(대형)', dLat: 5, dLon: 6, price: 1300, canFree: true, owner: null, status: 'none', desc: '강물 취수가 가장 유리한 특급 명당' },
                    { id: 'RV-03', name: '강변 숲 구역 A-03호(대형)', dLat: -5, dLon: -5, price: 1100, canFree: true, owner: null, status: 'none', desc: '대규모 산소 돔 및 생태 농장 부지' },
                    { id: 'RV-04', name: '강변 삼각주 A-04호(대형)', dLat: -4, dLon: 7, price: 1500, canFree: true, owner: null, status: 'none', desc: '두 강줄기가 합류하는 비옥한 삼각주' }
                ]
            },
            {
                id: 'greenvalley',
                name: '🌲 그린밸리 대평원',
                sub: '넓은 땅 · 30일 무상임대',
                type: 'free',
                lat: -18, lon: 35,
                boraMsg: '“그린밸리 대평원 상공입니다, 사장님! 넓고 평탄한 녹지 구획들이라 거대한 기지를 세우기 딱 좋아요. 눈으로 보고 마음에 드는 구획을 골라보세요!”',
                plots: [
                    { id: 'GV-01', name: '그린밸리 B-01호(대형)', dLat: 4, dLon: -5, price: 1000, canFree: true, owner: null, status: 'none', desc: '태양광 발전 및 대평원 복합 단지' },
                    { id: 'GV-02', name: '오아시스 B-02호(대형)', dLat: 3, dLon: 6, price: 1400, canFree: true, owner: null, status: 'none', desc: '천연 지하수 호수를 품은 핵심 녹지' },
                    { id: 'GV-03', name: '그린밸리 남단 B-03호(대형)', dLat: -5, dLon: 0, price: 1100, canFree: true, owner: null, status: 'none', desc: '테라포밍 산림 공원 예정 구역' }
                ]
            },
            {
                id: 'coastal',
                name: '🌊 코스탈 베이 해안도시',

                plots: [
                    { id: 'CB-01', name: '오션뷰 하버 C-01호(소형)', dLat: 3, dLon: -4, price: 2500, canFree: false, owner: null, status: 'none', desc: '바다 조망권 1열 최고급 해안 상업지' },
                    { id: 'CB-02', name: '마리나 부두 C-02호(소형)', dLat: 4, dLon: 5, price: 2800, canFree: false, owner: null, status: 'none', desc: '해상 교역선 중심 항만 노른자위 땅' },
                    { id: 'CB-03', name: '선셋 비치 C-03호(소형)', dLat: -4, dLon: 1, price: 2400, canFree: false, owner: null, status: 'none', desc: '해안 휴양 돔 복합 개발 지구' }
                ]
            },
            {
                id: 'olympus',
                name: '🏙️ 올림푸스 센트럴 시티',
                sub: '초밀집 도심 · $REDM 코인 전용',
                type: 'city',
                lat: -12, lon: -38,
                boraMsg: '“화성의 수도 올림푸스 센트럴 시티 상공입니다! 행정과 금융이 집중된 핵심지라 오직 <b>$REDM 코인</b>으로만 영구 등기 분양이 가능합니다!”',
                plots: [
                    { id: 'OL-01', name: '센트럴 광장 D-01호(소형)', dLat: 3, dLon: -4, price: 3200, canFree: false, owner: null, status: 'none', desc: '중앙 광장 바로 앞 초특급 랜드마크 부지' },
                    { id: 'OL-02', name: '테크 타워 D-02호(소형)', dLat: 3, dLon: 5, price: 3000, canFree: false, owner: null, status: 'none', desc: '우주 엘리베이터 및 통신 본부 인접지' },
                    { id: 'OL-03', name: '메트로 역세권 D-03호(소형)', dLat: -4, dLon: 0, price: 2700, canFree: false, owner: null, status: 'none', desc: '자기부상열차 중앙역 환승 특구' }

        /* =====================================================================
           2. Three.js 풀스크린 3D 우주 & 고해상도 지구화 화성 구체 생성
           ===================================================================== */
        let scene, camera, renderer, planetGroup, marsMesh, cloudMesh, base3DGroup;
        const PLANET_RADIUS = 10;

        // 카메라 부드러운 이동(원테이크 줌인)을 위한 목표값
        let camDist = 28;        // 중심으로부터의 거리 (28: 우주 궤도 -> 13.5: 지역 상공 -> 10.65: 지표면 코앞)
        let targetCamDist = 28;
        let currentRotX = 0.15, currentRotY = 0;
        let targetRotX = 0.15, targetRotY = 0;
        let autoRotate = true;

        // 구면 좌표(위도 lat, 경도 lon)를 3D 벡터(x,y,z)로 변환
        function latLonToVector3(lat, lon, radius) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lon + 90) * (Math.PI / 180);
            const x = -radius * Math.sin(phi) * Math.cos(theta);
            const z = radius * Math.sin(phi) * Math.sin(theta);
            const y = radius * Math.cos(phi);
            return new THREE.Vector3(x, y, z);
        }

        // 리얼한 화성 지형 + 푸른 강/바다 + 크레이터 질감 텍스처 생성
        function generateRealisticMarsTexture(mode = 'current') {
            const canvas = document.createElement('canvas');
            canvas.width = 2048;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            // 1) 화성 대륙 베이스 그라데이션
            const bgGrad = ctx.createLinearGradient(0, 0, 0, 1024);
            if (mode === 'lastMonth') {
                bgGrad.addColorStop(0, '#3b1109');
                bgGrad.addColorStop(0.5, '#8c2d19');
                bgGrad.addColorStop(1, '#2e0c05');
            } else {
                bgGrad.addColorStop(0, '#4a150b');
                bgGrad.addColorStop(0.5, '#b84121');
                bgGrad.addColorStop(1, '#3b1109');
            }
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, 2048, 1024);

            // 2) 수많은 입체 크레이터와 협곡 질감
            for (let i = 0; i < 450; i++) {
                const x = Math.random() * 2048;
                const y = Math.random() * 1024;
                const r = Math.random() * 35 + 3;
                ctx.fillStyle = i % 2 === 0 ? 'rgba(30, 8, 3, 0.35)' : 'rgba(255, 140, 90, 0.18)';
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            }

            // 지난달(원시 황무지) 모드면 물과 녹지를 그리지 않음
            if (mode === 'lastMonth') return new THREE.CanvasTexture(canvas);

            const waterAlpha = mode === 'lastWeek' ? 0.45 : 0.92;

            // 3) 각 지역 좌표 주변에 푸른 바다, 운하(강줄기), 초록 녹지 그리기
            marsRegions.forEach(reg => {
                // 위도/경도를 텍스처 UV 픽셀 좌표로 매핑
                const u = ((reg.lon + 180) / 360) * 2048;
                const v = ((90 - reg.lat) / 180) * 1024;

                // 녹지 숲 지대
                const greenGrad = ctx.createRadialGradient(u, v, 10, u, v, 220);
                greenGrad.addColorStop(0, `rgba(16, 185, 129, ${0.75 * waterAlpha})`);
                greenGrad.addColorStop(0.6, `rgba(5, 150, 105, ${0.45 * waterAlpha})`);
                greenGrad.addColorStop(1, 'transparent');
                ctx.fillStyle = greenGrad;
                ctx.beginPath();
                ctx.arc(u, v, 220, 0, Math.PI * 2);
                ctx.fill();

                // 바다 및 강줄기(운하)
                ctx.save();
                ctx.strokeStyle = `rgba(56, 189, 248, ${waterAlpha})`;
                ctx.lineWidth = 18;
                ctx.shadowColor = '#00e5ff';
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.moveTo(u - 160, v - 90);
                ctx.bezierCurveTo(u - 40, v + 30, u + 50, v - 40, u + 170, v + 80);
                ctx.stroke();

                if (reg.id === 'coastal') {
                    ctx.fillStyle = `rgba(2, 132, 199, ${waterAlpha})`;
                    ctx.beginPath();
                    ctx.ellipse(u + 40, v - 20, 130, 85, 0.3, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            });

            return new THREE.CanvasTexture(canvas);
        }

        function initWorld() {
            const container = document.getElementById('webglContainer');
            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, camDist);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // 조명 설정 (태양광 + 우주 반사광)
            scene.add(new THREE.AmbientLight(0xdbeafe, 0.55));
            const sun = new THREE.DirectionalLight(0xfff1e6, 1.4);
            sun.position.set(25, 15, 25);
            scene.add(sun);

            // 행성 전체 그룹 (화성 + 구름 + 표면에 지어질 3D 기지 건물들)
            planetGroup = new THREE.Group();
            scene.add(planetGroup);

            // 1) 둥근 3D 화성 구체
            const marsGeo = new THREE.SphereGeometry(PLANET_RADIUS, 96, 96);
            const tex = generateRealisticMarsTexture('current');
            const marsMat = new THREE.MeshStandardMaterial({
                map: tex,
                bumpMap: tex,
                bumpScale: 0.15,
                roughness: 0.7,
                metalness: 0.15
            });
            marsMesh = new THREE.Mesh(marsGeo, marsMat);
            planetGroup.add(marsMesh);

            // 2) 살아 움직이는 대기권 구름 및 후광 구체
            const atmosGeo = new THREE.SphereGeometry(PLANET_RADIUS + 0.35, 64, 64);
            const atmosMat = new THREE.MeshBasicMaterial({
                color: 0x38bdf8,
                transparent: true,
                opacity: 0.14,
                side: THREE.BackSide
            });
            planetGroup.add(new THREE.Mesh(atmosGeo, atmosMat));

            // 3) 3단계 착륙 시 화성 땅바닥 위에 솟아오를 입체 산소 돔 & 기지 타워 그룹
            base3DGroup = new THREE.Group();
            base3DGroup.visible = false;
            // 반투명 푸른 생태 산소 돔
            const domeGeo = new THREE.SphereGeometry(0.18, 32, 32);
            const domeMat = new THREE.MeshStandardMaterial({ color: 0x00e5ff, transparent: true, opacity: 0.65, roughness: 0.2 });
            const dome = new THREE.Mesh(domeGeo, domeMat);
            // 돔 옆의 에너지 채굴 타워
            const towerGeo = new THREE.CylinderGeometry(0.03, 0.05, 0.35, 16);
            const towerMat = new THREE.MeshStandardMaterial({ color: 0xff5722 });
            const tower = new THREE.Mesh(towerGeo, towerMat);
            tower.position.set(0.18, 0.1, 0);
            base3DGroup.add(dome);
            base3DGroup.add(tower);
            planetGroup.add(base3DGroup);

            // 4) 광활한 우주 배경 별자리 (2,000개)
            const starGeo = new THREE.BufferGeometry();
            const starPos = new Float32Array(2000 * 3);
            for (let i = 0; i < 2000 * 3; i++) {
                starPos[i] = (Math.random() - 0.5) * 180;
            }
            starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
            scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.12 })));

            // 마우스 드래그로 언제든 화성 회전 가능
            let dragging = false;
            let prev = { x: 0, y: 0 };
            container.addEventListener('mousedown', e => {
                dragging = true;
                autoRotate = false;
                prev = { x: e.clientX, y: e.clientY };
            });
            window.addEventListener('mouseup', () => dragging = false);
            window.addEventListener('mousemove', e => {
                if (!dragging) return;
                const speed = currentZoomStage === 1 ? 0.005 : 0.002;
                targetRotY += (e.clientX - prev.x) * speed;
                targetRotX = Math.max(-1.2, Math.min(1.2, targetRotX + (e.clientY - prev.y) * speed));
                prev = { x: e.clientX, y: e.clientY };
            });

            // 마우스 휠로도 자연스럽게 줌인/줌아웃 체감
            container.addEventListener('wheel', e => {
                targetCamDist = Math.max(10.6, Math.min(34, targetCamDist + e.deltaY * 0.01));
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            buildSpatialMarkers();
            renderControlPanel();
            animateLoop();
        }

        /* =====================================================================
           3. 3D 화성 표면에 붙어서 따라다니는 공간 마커(핀 & 구획 그리드)
           ===================================================================== */
        const domMarkers = [];

        function buildSpatialMarkers() {
            const layer = document.getElementById('markersLayer');
            layer.innerHTML = '';
            domMarkers.length = 0;

            marsRegions.forEach(reg => {
                // 1단계용 대륙 핀
                const pinEl = document.createElement('div');
                pinEl.className = `spatial-marker region-pin ${reg.type}`;
                pinEl.innerHTML = `${reg.name} <div style="font-size:0.68rem; font-weight:normal; opacity:0.85;">${reg.sub}</div>`;
                pinEl.onclick = () => zoomToStage2(reg);
                layer.appendChild(pinEl);

                domMarkers.push({
                    stage: 1,
                    regionId: reg.id,
                    el: pinEl,
                    localPos: latLonToVector3(reg.lat, reg.lon, PLANET_RADIUS + 0.15)
                });

                // 2단계용 해당 대륙 안의 세부 토지 구획(그리드)들
                reg.plots.forEach(plot => {
                    const boxEl = document.createElement('div');
                    boxEl.id = `marker-${plot.id}`;
                    boxEl.className = `spatial-marker plot-grid-box ${reg.type === 'city' ? 'city-plot' : ''} ${plot.owner ? 'owned' : ''}`;
                    updatePlotMarkerText(boxEl, plot);
                    boxEl.onclick = () => selectPlotIn3D(reg, plot);
                    layer.appendChild(boxEl);

                    domMarkers.push({
                        stage: 2,
                        regionId: reg.id,
                        plotId: plot.id,
                        el: boxEl,
                        localPos: latLonToVector3(reg.lat + plot.dLat, reg.lon + plot.dLon, PLANET_RADIUS + 0.05)
                    });
                });
            });
        }

        function updatePlotMarkerText(el, plot) {
            let tag = plot.canFree ? (hasUsedFreeLease ? `${plot.price} REDM` : `🎁 30일 무상임대`) : `💎 ${plot.price} REDM`;
            if (plot.status === 'leased') tag = `🕒 사장님 임대중(D-30)`;
            if (plot.status === 'owned') tag = `👑 사장님 영구소유`;
            el.className = `spatial-marker plot-grid-box ${!plot.canFree ? 'city-plot' : ''} ${plot.owner ? 'owned' : ''}`;
            el.innerHTML = `<b>${plot.name}</b><span>${tag}</span>`;
        }

        // 매 프레임마다 3D 화성 위도/경도 좌표를 화면 픽셀(X, Y)로 계산해 마커를 부착
        function syncMarkersWith3DGlobe() {
            const camPos = camera.position;
            domMarkers.forEach(m => {
                // 현재 단계에 맞는 마커만 표시
                if (currentZoomStage === 1 && m.stage !== 1) { m.el.style.display = 'none'; return; }
                if (currentZoomStage === 2 && (m.stage !== 2 || m.regionId !== activeRegion.id)) { m.el.style.display = 'none'; return; }
                if (currentZoomStage === 3) { m.el.style.display = 'none'; return; }

                // 화성 회전을 반영한 월드 좌표 구하기
                const worldPos = m.localPos.clone().applyEuler(planetGroup.rotation);

                // 화성 뒤편(반대쪽)으로 넘어간 핀은 안 보이게 숨김
                if (worldPos.z < 2.5) {
                    m.el.style.display = 'none';
                    return;
                }

                const projected = worldPos.clone().project(camera);
                const x = (projected.x * 0.5 + 0.5) * window.innerWidth;
                const y = (-(projected.y * 0.5) + 0.5) * window.innerHeight;

                m.el.style.display = 'flex';
                m.el.style.left = `${x}px`;
                m.el.style.top = `${y}px`;
            });
        }

        /* =====================================================================
           4. 원테이크 3단계 연속 클로즈업(Fly-to) 카메라 제어 & 비즈니스 로직
           ===================================================================== */
        function aimGlobeAt(lat, lon) {
            autoRotate = false;
            targetRotX = lat * (Math.PI / 180);
            targetRotY = -lon * (Math.PI / 180);
        }

        // [1단계 -> 2단계] 대륙 상공으로 1차 클로즈업 (토지 구획 그리드 노출)
        function zoomToStage2(region) {
            currentZoomStage = 2;
            activeRegion = region;
            activePlot = null;
            base3DGroup.visible = false;

            aimGlobeAt(region.lat, region.lon);
            targetCamDist = 13.4; // 상공 400km까지 줌인!

            document.getElementById('boraSpeech').innerHTML = region.boraMsg;
            document.getElementById('btnZoomOut').style.display = 'block';
            renderControlPanel();
        }

        // [2단계] 화성 표면 위의 개별 땅(구획) 클릭 시
        function selectPlotIn3D(region, plot) {
            activePlot = plot;
            // 선택한 땅이 정중앙에 오도록 미세 회전 + 조금 더 가깝게 줌인
            aimGlobeAt(region.lat + plot.dLat, region.lon + plot.dLon);
            targetCamDist = 12.2;

            if (plot.owner) {
                document.getElementById('boraSpeech').innerHTML = `“사장님의 영토인 <b>[${plot.name}]</b>입니다! 오른쪽 아래의 <b>[🚀 지표면 코앞으로 착륙하기]</b>를 누르면 3D 산소 돔 기지가 눈앞에 펼쳐져요!”`;
            } else if (plot.canFree) {
                if (!hasUsedFreeLease) {
                    document.getElementById('boraSpeech').innerHTML = `“사장님, <b>[${plot.name}]</b> 위치가 정말 끝내줘요! 첫 녹지 혜택으로 <b>30일간 비용 없이 무상임대</b>를 받아 바로 개척해 보시겠어요?”`;
                } else {
                    document.getElementById('boraSpeech').innerHTML = `“사장님, 1인당 1회 무상임대 혜택은 이미 사용하셔서, 이 땅을 추가로 확보하시려면 <b>${plot.price.toLocaleString()} REDM 코인</b>으로 정식 분양을 받으셔야 해요!”`;
                }
            } else {
                document.getElementById('boraSpeech').innerHTML = `“핵심 도시 구역인 <b>[${plot.name}]</b>을 고르셨네요! 여긴 중요 지역이라 무상임대 없이 <b>${plot.price.toLocaleString()} REDM 코인</b>으로만 영구 분양받으실 수 있어요!”`;
            }
            renderControlPanel();
        }

        // [2단계 -> 3단계] 내 땅 지표면 코앞까지 2차 초근접 클로즈업 & 3D 기지 건물 생성!
        function zoomToStage3Base(plot) {
            currentZoomStage = 3;
            const lat = activeRegion.lat + plot.dLat;
            const lon = activeRegion.lon + plot.dLon;

            // 화성 표면 해당 좌표에 3D 산소 돔과 타워 배치
            const surfacePos = latLonToVector3(lat, lon, PLANET_RADIUS);
            base3DGroup.position.copy(surfacePos);
            base3DGroup.lookAt(surfacePos.clone().multiplyScalar(2));
            base3DGroup.visible = true;

            aimGlobeAt(lat, lon);
            targetCamDist = 10.75; // 땅바닥 코앞(고도 1km)까지 초근접 줌인!

            document.getElementById('boraSpeech').innerHTML = `“와아! 화면 전환 없이 우주에서 <b>[${plot.name}]</b> 지표면 코앞까지 한 번에 착륙했어요! 눈앞에 세워진 푸른 3D 산소 돔 보이시죠? 타임랩스로 과거 황무지 시절과 비교해 보거나 채굴을 시작해 보세요!”`;
            renderControlPanel();
        }

        // 줌아웃 복귀 버튼
        function stepZoomOut() {
            if (currentZoomStage === 3) {
                zoomToStage2(activeRegion);
            } else {
                currentZoomStage = 1;
                activeRegion = null;
                activePlot = null;
                base3DGroup.visible = false;
                targetCamDist = 28;
                autoRotate = true;
                document.getElementById('btnZoomOut').style.display = 'none';
                document.getElementById('boraSpeech').innerHTML = `“다시 우주 궤도로 줌아웃했습니다, 사장님! 둥근 화성을 돌려보며 다른 대륙이나 해안 도시도 클릭해 보세요.”`;
                renderControlPanel();
            }
        }

        // 30일 무상임대 계약 (1회 제한 로직)
        function claimFreeLease() {
            if (!activePlot) return;
            if (hasUsedFreeLease) {
                alert(`❗ [무상임대 거절 안내]\n\n보라: "사장님! 30일 무상임대 혜택은 한 아이디당 1곳만 제공됩니다.\n이 토지를 원하시면 $REDM 코인을 지불해 정식 분양을 받아주세요!"`);
                return;
            }
            hasUsedFreeLease = true;
            activePlot.owner = "사장님";
            activePlot.status = "leased";
            updatePlotMarkerText(document.getElementById(`marker-${activePlot.id}`), activePlot);
            updateTopHUD();
            alert(`🎉 [${activePlot.name}] 30일 무상임대 완료!\n이제 지표면 코앞으로 착륙해 기지를 가꿔보세요!`);
            zoomToStage3Base(activePlot);
        }

        // 코인 지불 영구 분양
        function buyPlotWithCoin() {
            if (!activePlot) return;
            if (myBalance < activePlot.price) {
                alert("❌ 보유하신 $REDM 코인이 부족합니다!");
                return;
            }
            myBalance -= activePlot.price;
            burnedCoin += Math.floor(activePlot.price * 0.1);
            activePlot.owner = "사장님";
            activePlot.status = "owned";
            updatePlotMarkerText(document.getElementById(`marker-${activePlot.id}`), activePlot);
            updateTopHUD();
            alert(`👑 [${activePlot.name}] 영구 소유 등기 완료!`);
            zoomToStage3Base(activePlot);
        }

        // 기지 채굴 및 테라포밍 작업
        function runBaseWork(workName, reward) {
            myBalance += reward;
            updateTopHUD();
            document.getElementById('boraSpeech').innerHTML = `“멋져요 사장님! <b>[${workName}]</b> 작업으로 <b>+${reward} REDM</b> 코인을 획득하셨습니다! 모은 코인으로 임대 땅을 영구 소유하거나 도시 땅도 사보세요!”`;
        }

        // 3D 화성 전체 타임랩스 아카이브 전환 (현재 푸른 화성 <-> 지난주 <-> 지난달 붉은 원시 화성)
        function change3DTimeline(mode, btn) {
            document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const newTex = generateRealisticMarsTexture(mode);
            marsMesh.material.map = newTex;
            marsMesh.material.needsUpdate = true;

            if (mode === 'current') {
                base3DGroup.visible = true;
                document.getElementById('boraSpeech').innerHTML = `“<b>[현재 모습]</b> 푸른 강물이 흐르고 산소 돔이 가동 중인 테라포밍 화성이에요!”`;
            } else if (mode === 'lastWeek') {
                base3DGroup.visible = true;
                document.getElementById('boraSpeech').innerHTML = `“<b>[지난주 기록]</b> 처음 운하 수로를 파서 물길을 끌어오던 기초 공사 시절 모습입니다.”`;
            } else {
                base3DGroup.visible = false;
                document.getElementById('boraSpeech').innerHTML = `“<b>[지난달 기록]</b> 사장님이 개척하시기 전, 물 한 방울 없이 붉은 모래만 가득하던 원시 화성입니다.”`;
            }
        }

        function updateTopHUD() {
            document.getElementById('balanceText').innerText = myBalance.toLocaleString();
            document.getElementById('burnText').innerText = burnedCoin.toLocaleString();
            const t = document.getElementById('leaseTicketText');
            if (hasUsedFreeLease) {
                t.innerText = "사용 완료 (추가 토지는 코인 결제)";
                t.style.color = "#f59e0b";
            }
        }

        // 우측 하단 컨트롤 패널 UI 렌더링
        function renderControlPanel() {
            const titleEl = document.getElementById('panelTitle');
            const bodyEl = document.getElementById('panelBody');

            if (currentZoomStage === 1) {
                titleEl.innerText = "🔭 1단계: 클로즈업할 화성 지역 선택";
                bodyEl.innerHTML = `
                    <div class="btn-grid">
                        ${marsRegions.map(r => `
                            <button class="holo-btn ${r.type === 'free' ? 'free-tag' : 'city-tag'}" onclick="zoomToStage2ById('${r.id}')">
                                <b>${r.name}</b>
                                <small>${r.sub}</small>
                            </button>
                        `).join('')}
                    </div>
                `;
            } else if (currentZoomStage === 2) {
                titleEl.innerText = `📍 2단계: ${activeRegion.name}`;
                if (!activePlot) {
                    bodyEl.innerHTML = `<p style="margin:0; font-size:0.88rem; color:#cbd5e1;">👆 눈앞의 3D 화성 표면 위에 펼쳐진 <b>네모 구획(필지)</b>을 직접 클릭해 원하는 땅을 골라보세요!</p>`;
                } else {
                    let buttonsHtml = '';
                    if (activePlot.owner) {
                        if (activePlot.status === 'leased') {
                            buttonsHtml += `<button class="btn-coin" onclick="buyPlotWithCoin()">👑 영구 소유 전환 (${activePlot.price} REDM)</button>`;
                        }
                        buttonsHtml += `<button class="btn-primary" onclick="zoomToStage3Base(activePlot)">🚀 지표면 코앞으로 착륙하기</button>`;
                    } else {
                        if (activePlot.canFree) {
                            buttonsHtml += `<button class="btn-primary" onclick="claimFreeLease()">🎁 30일 무상임대 (0 REDM)</button>`;
                        }
                        buttonsHtml += `<button class="btn-coin" onclick="buyPlotWithCoin()">💰 코인 영구 분양 (${activePlot.price} REDM)</button>`;
                    }

                    bodyEl.innerHTML = `
                        <div style="font-size:0.92rem; font-weight:bold; color:#00e5ff;">선택됨: ${activePlot.name}</div>
                        <div style="font-size:0.8rem; color:#94a3b8; margin-top:3px;">${activePlot.desc}</div>
                        <div class="action-row">${buttonsHtml}</div>
                    `;
                }
            } else if (currentZoomStage === 3) {
                titleEl.innerText = `🚀 3단계: ${activePlot.name} 지표면 기지`;
                bodyEl.innerHTML = `
                    <div class="timeline-row">
                        <button class="time-btn active" onclick="change3DTimeline('current', this)">🟢 현재 푸른 기지</button>
                        <button class="time-btn" onclick="change3DTimeline('lastWeek', this)">⏳ 지난주 수로공사</button>
                        <button class="time-btn" onclick="change3DTimeline('lastMonth', this)">📜 지난달 황무지</button>
                    </div>
                    <div class="action-row">
                        <button class="btn-primary" onclick="runBaseWork('지하 수맥 탐사', 50)">🛰️ 탐사 (+50)</button>
                        <button class="btn-coin" onclick="runBaseWork('레드엠 코어 채굴', 120)">⛏️ 채굴 (+120)</button>
                        <button class="btn-primary" style="background:#00e5ff;" onclick="runBaseWork('생태 산소돔 증축', 200)">🏗️ 증축 (+200)</button>
                    </div>
                `;
            }
        }

        function zoomToStage2ById(id) {
            const reg = marsRegions.find(r => r.id === id);
            if (reg) zoomToStage2(reg);
        }

        function animateLoop() {
            requestAnimationFrame(animateLoop);

            if (autoRotate && currentZoomStage === 1) {
                targetRotY += 0.0012;
            }

            // 끊김 없는 부드러운 3D 회전 및 카메라 거리(고도) 보간
            currentRotX += (targetRotX - currentRotX) * 0.07;
            currentRotY += (targetRotY - currentRotY) * 0.07;
            planetGroup.rotation.x = currentRotX;
            planetGroup.rotation.y = currentRotY;

            camDist += (targetCamDist - camDist) * 0.07;
            camera.position.z = camDist;

            // 실시간 고도 표시 업데이트
            const km = Math.max(1, Math.floor((camDist - 10.65) * 850));
            document.getElementById('altitudeDisplay').innerText = `고도: ${km.toLocaleString()} KM (${currentZoomStage === 1 ? '우주 궤도' : currentZoomStage === 2 ? '지역 상공 구획 뷰' : '지표면 초근접 기지'})`;

            syncMarkersWith3DGlobe();
            renderer.render(scene, camera);
        }

        window.onload = initWorld;
    </script>
</body>
</html>
